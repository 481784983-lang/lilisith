           }
            
            return navHtml + contentHtml;
        }

        // 全局选中物品缓存
      window.selectedItemKey = window.selectedItemKey || null;

        function renderBag() {
            const money = SafeGet(currentData, '财产.货币', {});
            const bags = SafeGet(currentData, '财产.背包[0]', {});
            
            // 货币栏金库质感
            const moneyHtml = `<div style="display:flex; gap:25px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; padding:15px; border:2px solid var(--gold-dark); background:linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(212,175,55,0.1)); box-shadow: 0 4px 10px rgba(0,0,0,0.05), inset 0 0 15px rgba(255,255,255,0.8); border-radius:4px;">
                ${cleanKeys(money).map(k => `
                    <div style="display:flex; align-items:center; gap:6px; font-family:var(--font-header); font-size:1.15em;">
                        <i class="fa-solid fa-coins" style="color:var(--gold-dark); filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));"></i>
                        <span style="color:var(--ink-primary); font-weight:900;">${money[k][0]}</span> <span style="font-size:0.75em; color:var(--ink-secondary); font-weight:bold; letter-spacing:1px;">${k}</span>
                    </div>`).join('') || '<span style="font-family:var(--font-header); opacity:0.6;">金库空荡无物</span>'}
            </div>`;

            const allItemKeys = cleanKeys(bags);
            const types = ['全部', ...new Set(allItemKeys.map(k => SafeGet(bags[k], 'type[0]', '杂物')))];
            const filterHtml = `<div style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                ${types.map(t => `<button class="stamp-btn" style="padding:4px 15px; font-size:0.8em; border-radius:15px; ${window.invFilter===t?'background:var(--ink-primary);color:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);':''}" onclick="window.selectedItemKey=null; window.UI.switchInvFilter('${t}')">${t}</button>`).join('')}
            </div>`;

            const filteredKeys = allItemKeys.filter(k => window.invFilter === '全部' || !window.invFilter || SafeGet(bags[k], 'type[0]', '杂物') === window.invFilter);
            const totalPages = Math.ceil(filteredKeys.length / ITEMS_PER_PAGE) || 1;
            if (pageState.bag > totalPages) pageState.bag = totalPages; 
            const startIdx = (pageState.bag - 1) * ITEMS_PER_PAGE;
            const pagedKeys = filteredKeys.slice(startIdx, startIdx + ITEMS_PER_PAGE);

            // 如果没有选中的物品，默认选中当前页第一个
            if (!window.selectedItemKey && pagedKeys.length > 0) {
                window.selectedItemKey = pagedKeys[0];
            } else if (pagedKeys.length === 0) {
                window.selectedItemKey = null;
            }

            // 渲染顶部的【详情视窗】
            let inspectHtml = '';
            if (window.selectedItemKey && bags[window.selectedItemKey]) {
                const k = window.selectedItemKey;
                const item = bags[k];
                const name = SafeGet(item, '名称[0]', k);
                const count = SafeGet(item, '数量[0]', 1);
                const desc = SafeGet(item, '描述[0]', '一件神秘的物品。');
                const type = SafeGet(item, 'type[0]', '杂物');
                const rarity = SafeGet(item, '稀有度[0]', '普通');
                const canUse = SafeGet(item, 'usable[0]', false);
                
                const iconMap = { '消耗品': 'fa-flask', '装备': 'fa-shield-halved', '材料': 'fa-gem', '杂物': 'fa-box' };
                const icon = iconMap[type] || 'fa-ring';

                inspectHtml = `
                <div class="item-inspect-panel fade-effect">
                    <div class="inspect-title"><i class="fa-solid ${icon} rarity-${rarity}" style="font-size:0.8em; border:none; box-shadow:none;"></i> ${name}</div>
                    <div class="inspect-meta">
                        <span>类别: ${type}</span>
                        <span>评级: <b class="rarity-${rarity}" style="border:none;box-shadow:none;text-shadow:0 1px 1px rgba(0,0,0,0.5);">${rarity}</b></span>
                        <span>持有量: x${count}</span>
                    </div>
                    <div class="inspect-desc">${desc}</div>
                    <div class="inspect-actions">
                        ${canUse ? `<button class="magic-btn" style="flex:1;" onclick="window.UI.send('/send [使用] ${k} |/trigger')"><i class="fa-solid fa-hand-sparkles"></i> 注入魔力 (使用)</button>` : `<button class="magic-btn" style="flex:1; opacity:0.4; cursor:not-allowed;" disabled><i class="fa-solid fa-lock"></i> 缺乏使用媒介</button>`}
                        <button class="magic-btn" style="border-color:rgba(138,3,3,0.5); color:var(--accent-red); padding: 5px 20px;" onclick="window.UI.send('/send [丢弃] ${k} |/trigger')"><i class="fa-solid fa-trash-can"></i> 遗弃</button>
                    </div>
                </div>`;
            }

            // 渲染网格
            const gridHtml = pagedKeys.map(k => {
                const item = bags[k];
                const count = SafeGet(item, '数量[0]', 1);
                const type = SafeGet(item, 'type[0]', '杂物');
                const rarity = SafeGet(item, '稀有度[0]', '普通');
                const isSelected = window.selectedItemKey === k ? 'selected' : '';
                
                const iconMap = { '消耗品': 'fa-flask', '装备': 'fa-shield-halved', '材料': 'fa-gem', '杂物': 'fa-box' };
                const icon = iconMap[type] || 'fa-ring';

                // 点击时触发重新渲染并更新顶部视窗，changePage('bag', 0) 实现原地无刷新重绘
                return `
                <div class="item-slot rarity-${rarity} ${isSelected}" onclick="window.selectedItemKey='${k}'; window.UI.changePage('bag', 0)">
                    <i class="fa-solid ${icon}"></i>
                    <div class="item-count">${count}</div>
                </div>`;
            }).join('');

            const paginationHtml = renderPaginationHtml('bag', totalPages);

            return `<h2 class="art-title">纳物行囊</h2>
                    ${moneyHtml}
                    ${filterHtml}
                    ${inspectHtml}
                    <div class="bag-grid-container fade-effect">
                        ${gridHtml || '<div style="grid-column: 1 / -1; text-align:center; align-self:center; opacity:0.5; font-family:var(--font-header);">虚空之中，空无一物</div>'}
                    </div>
                    ${filteredKeys.length > ITEMS_PER_PAGE ? paginationHtml : ''}`;
        }
function renderQuests() {
    let tasks = SafeGet(currentData, '任务列表[0]', null);
    if (!tasks) tasks = SafeGet(currentData, '任务', {});
    const taskKeys = cleanKeys(tasks);

    if (taskKeys.length === 0) {
        return `<h2 class="art-title">公会委托</h2>
        <div style="text-align:center; padding:50px; opacity:0.6; font-family:var(--font-header);">
            <i class="fa-solid fa-scroll" style="font-size:3em; margin-bottom:15px; color:var(--gold-dark);"></i><br>
            <span style="font-size:1.2em; letter-spacing:2px;">布告栏上空空如也</span>
        </div>`;
    }

    const transMap = {
        'gold': '金币', 'money': '银币', 'coin': '铜币',
        'exp': '经验', 'xp': '经验值',
        'item': '物品', 'fp': '命运点(FP)',
        'rep': '声望', 'reputation': '声望'
    };
    const translate = (k) => transMap[k.toLowerCase()] || k;

    const listHtml = taskKeys.map(k => {
        const task = tasks[k];
        if (!task || typeof task !== 'object') return '';

        const title = SafeGet(task, '标题[0]', `契约 ${k}`);
        const publisher = SafeGet(task, '发布者[0]', '神秘人');
        const target = SafeGet(task, '当前目标[0]', '...');
        const difficulty = SafeGet(task, '难度[0]', '未知');
        const penalty = SafeGet(task, '失败惩罚[0]', '无');

        let rewardHtml = '';
        let rewardObj = SafeGet(task, '奖励[0]', null) || SafeGet(task, '奖励', {});

        if (isObject(rewardObj)) {
            ['货币', '属性'].forEach(cat => {
                 const catObj = SafeGet(rewardObj, cat, {});
                 if(isObject(catObj)) {
                     cleanKeys(catObj).forEach(ck => {
                         const val = SafeGet(catObj, ck+'[0]', 0);
                         if(val > 0) rewardHtml += `<span class="reward-badge"><i class="fa-solid fa-coins"></i> ${translate(ck)} <span style="font-family:'Courier New';">x${val}</span></span>`;
                     });
                 }
            });
            const exp = SafeGet(rewardObj, '经验[0]', 0);
            if(exp > 0) rewardHtml += `<span class="reward-badge"><i class="fa-solid fa-star"></i> 经验 <span style="font-family:'Courier New';">x${exp}</span></span>`;
            const fp = SafeGet(rewardObj, 'FP[0]', SafeGet(rewardObj, '命运点数[0]', 0));
            if(fp > 0) rewardHtml += `<span class="reward-badge" style="color:var(--accent-red); border-color:var(--accent-red);"><i class="fa-solid fa-heart"></i> 宿命点 <span style="font-family:'Courier New';">x${fp}</span></span>`;
        }
        if(rewardHtml === '') rewardHtml = '<span style="opacity:0.6; font-family:var(--font-header); font-size:0.9em;">(无明确奖赏)</span>';

        return `
        <details class="art-card">
            <summary class="card-header-area">
                <div style="display:flex; align-items:center; gap:12px;">
                    <i class="fa-solid fa-file-signature" style="color:var(--gold-dark); font-size:1.2em;"></i>
                    <span style="font-family:var(--font-header); font-weight:900; font-size:1.1em; letter-spacing:1px; color:var(--ink-primary);">${title}</span>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <span style="font-family:var(--font-header); color:var(--accent-red); border:1px solid var(--accent-red); padding:2px 6px; font-size:0.8em;">Rank: ${difficulty}</span>
                    <span class="fold-indicator"><i class="fa-solid fa-angle-down"></i></span>
                </div>
            </summary>

            <div class="card-body-area">
                <div class="quest-details-wrapper">
                    
                    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; border-bottom:1px solid rgba(0,0,0,0.1); padding-bottom:5px;">
                        <span class="quest-target-label">委托发起人:</span>
                        <span style="font-family:var(--font-header); font-weight:bold; font-size:1.1em; color:var(--ink-primary);">${publisher}</span>
                    </div>
                    
                    <div class="quest-target-box">
                        <div class="quest-target-label">绝对指令 / 讨伐目标:</div>
                        <div class="quest-target-value">${target}</div>
                    </div>

                    <div style="margin-top:20px;">
                        <div class="quest-target-label" style="margin-bottom:8px;">
                            <i class="fa-solid fa-scale-balanced" style="color:var(--gold-dark);"></i> 契约报酬
                        </div>
                        <div style="display:flex; flex-wrap:wrap; gap:8px;">${rewardHtml}</div>
                    </div>

                    ${penalty !== '无' && penalty !== '' ? `
                        <div class="quest-penalty">
                            <i class="fa-solid fa-droplet"></i> 违约代偿: ${penalty}
                        </div>
                    ` : ''}
                </div>
            </div>
        </details>`;
    }).join('');

    return `<h2 class="art-title">公会委托</h2><div class="fade-effect">${listHtml}</div>`;
}
// [修复美化版] 图鉴渲染
function renderCodex() {
            const list = SafeGet(currentData, '世界图鉴[0]', {});
            const keys = cleanKeys(list);
            
            // --- 分页逻辑 ---
            const totalPages = Math.ceil(keys.length / ITEMS_PER_PAGE);
            if (pageState.codex > totalPages) pageState.codex = totalPages || 1;
            const startIdx = (pageState.codex - 1) * ITEMS_PER_PAGE;
            const pagedKeys = keys.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            // ----------------
            
            if (keys.length === 0) {
                return `<h2 class="art-title">万象图鉴</h2>
                <div style="text-align:center; padding:50px; opacity:0.5; font-family:var(--font-header);">
                    <i class="fa-solid fa-book-open" style="font-size:3em; margin-bottom:10px;"></i><br>
                    ( 尚无记录 )
                </div>`;
            }

            const listHtml = pagedKeys.map(k => {
                const title = SafeGet(list[k], '标题[0]', k);
                const type = SafeGet(list[k], '分类[0]', '通用');
                const desc = SafeGet(list[k], '描述[0]', '暂无详细记载...').replace(/\\n/g, '<br>');
                
                return `
                <details class="codex-entry">
                    <summary class="codex-summary">
                        <span>${title}</span>
                        <span class="codex-tag">${type}</span>
                    </summary>
                    <div class="codex-content card-body-area">
                        <div class="codex-dropcap">${desc}</div>
                        <div style="text-align:right; margin-top:10px; opacity:0.4;">
                            <i class="fa-solid fa-feather-pointed"></i>
                        </div>
                    </div>
                </details>`;
            }).join('');

            return `
                <h2 class="art-title">万象图鉴</h2>
                <div style="padding:0 10px;" class="fade-effect">
                    ${listHtml}
                </div>
                ${renderPaginationHtml('codex', totalPages)}
            `;
        }
// [终极质感] 帝国快报渲染逻辑
        function renderNews() {
            const news = SafeGet(currentData, '今日新闻', {});
            const keys = cleanKeys(news);
            const date = SafeGet(currentData, '世界.时间[0]', '今日');

            if (keys.length === 0) {
                return `
                <h2 class="art-title">街头传闻</h2>
                <div style="text-align:center; padding:50px; opacity:0.6; font-family:var(--font-header); border: 1px dashed var(--gold-dark); background:rgba(255,255,255,0.3);">
                    <i class="fa-solid fa-wind" style="font-size:2em; margin-bottom:10px;"></i><br>
                    风平浪静，暂无传闻。
                </div>`;
            }

            const newsItems = keys.map((k, index) => {
                let content = SafeGet(news, k+'[0]', '...').replace(/\\n/g, '<br>');
                
                // 正则魔法：自动识别并高亮【大捷】、【绝密】等标签，打破长文本枯燥感
                content = content.replace(/【(.*?)】/g, '<span class="news-highlight-text">【$1】</span>');

                const isLast = index === keys.length - 1;
                
                return `
                <div class="news-article" style="position: relative; margin-bottom: 25px;">
                    <div class="news-header-line">
                        <div class="news-title">${k}</div>
                    </div>
                    <div class="news-meta">
                        <span><i class="fa-regular fa-clock"></i> ${date}</span>
                        <span style="color:var(--gold-dark);">✦</span>
                        <span>莉莉丝快报 宣</span>
                    </div>
                    <div class="news-body">
                        ${content}
                    </div>
                    ${!isLast ? `
                        <div class="art-divider" style="margin-top:35px;"><span class="art-dot">❧</span></div>
                    ` : ''}
                </div>`;
            }).join('');

            return `
            <h2 class="art-title">帝国快报</h2>
            <div class="news-sheet fade-effect">
                <div class="royal-seal-bg"></div>
                ${newsItems}
                <div style="margin-top:35px; text-align:center; font-family:var(--font-header); font-size:0.85em; color:var(--ink-secondary); border-top:1px solid rgba(138, 110, 37, 0.3); padding-top:15px; letter-spacing:2px;">
                    <i class="fa-solid fa-feather-pointed" style="color:var(--gold-dark);"></i> 记录于命运虚空
                </div>
            </div>`;
        }
        // --- [ 5. 战斗系统 ] ---
        window.Battle = {
            render: () => {
                const battleData = SafeGet(currentData, '战斗状态[0]', {});
                const allies = SafeGet(battleData, 'allies', {});
                const enemies = SafeGet(battleData, 'enemies', {});
                const allyKeys = cleanKeys(allies);
                const enemyKeys = cleanKeys(enemies);
                if (!battleTarget && (allyKeys.length || enemyKeys.length)) battleTarget = allyKeys[0] || enemyKeys[0];

                const renderUnit = (key, unit, isEnemy) => {
                    const hp = SafeGet(unit, '生命值[0]', 0); const maxHp = SafeGet(unit, '生命值上限[0]', 100);
                    const mp = SafeGet(unit, '法力值[0]', 0); const maxMp = SafeGet(unit, '法力值上限[0]', 100);
                    const selected = battleTarget === key ? 'selected' : '';
                    return `<div class="combatant ${selected}" onclick="window.Battle.select('${key}')"><div class="c-name"><span>${SafeGet(unit, '名称[0]', key)}</span> <small>${hp}/${maxHp}</small></div><div class="stat-mini-bar"><div class="hp-fill" style="width:${(hp/maxHp)*100}%"></div></div><div class="stat-mini-bar" style="height:3px; margin-top:2px;"><div class="mp-fill" style="width:${(mp/maxMp)*100}%"></div></div></div>`;
                };
                document.getElementById('ally-list').innerHTML = allyKeys.map(k => renderUnit(k, allies[k], false)).join('');
                document.getElementById('enemy-list').innerHTML = enemyKeys.map(k => renderUnit(k, enemies[k], true)).join('');
                window.Battle.renderPanel();
                const logs = SafeGet(battleData, 'combat_log', []);
                const logEl = document.getElementById('battle-log');
                logEl.innerHTML = (Array.isArray(logs) ? logs : [logs]).map(l => `<div class="log-entry">${l}</div>`).join('');
                logEl.scrollTop = logEl.scrollHeight;
                if(enemyKeys.length === 0 && allyKeys.length > 0) document.getElementById('end-battle-btn').classList.remove('hidden');
                else document.getElementById('end-battle-btn').classList.add('hidden');
            },
            select: (key) => { battleTarget = key; window.Battle.render(); },
            switchTab: (tab) => {
                battleTab = tab; 
                document.getElementById('btn-b-skill').classList.toggle('active', tab==='skills');
                document.getElementById('btn-b-item').classList.toggle('active', tab==='items');
                window.Battle.renderPanel();
            },
            renderPanel: () => {
                const listEl = document.getElementById('battle-actions-list');
                listEl.innerHTML = '';
                if (!battleTarget) return;
                if (battleTarget === 'player' || battleTarget === '主角') {
                    if (battleTab === 'skills') {
                        const skills = SafeGet(currentData, '主角.技能[0]', {});
                        listEl.innerHTML = cleanKeys(skills).map(k => `<div class="action-row" onclick="window.Battle.sendAction('使用技能 ${k}')"><span>${SafeGet(skills[k], '名称[0]', k)}</span> <small>${SafeGet(skills[k], 'cost[0]', '')}</small></div>`).join('') || '无技能';
                    } else {
                        const items = SafeGet(currentData, '财产.背包[0]', {});
                        listEl.innerHTML = cleanKeys(items).map(k => `<div class="action-row" onclick="window.Battle.sendAction('使用物品 ${k}')"><span>${SafeGet(items[k], '名称[0]', k)}</span> <small>x${SafeGet(items[k], '数量[0]', 1)}</small></div>`).join('') || '空';
                    }
                } else { listEl.innerHTML = '无法操作此单位'; }
            },
            sendAction: (act) => {
                const input = document.getElementById('battle-input');
                const name = battleTarget ? (SafeGet(currentData, `战斗状态[0].allies.${battleTarget}.名称[0]`) || battleTarget) : '我';
                input.value = input.value ? input.value + '\n' + `${name} [${act}]` : `${name} [${act}]`;
            },
            submitInput: () => {
                const input = document.getElementById('battle-input');
                if(!input.value.trim()) return;
                window.UI.send(`/send ${input.value.replace(/\n/g, ' ')} |/trigger`);
                input.value = '';
            }
        };

// --- [ 6. 启动 (增强版) ] ---
        async function Init() {
            console.log("正在初始化界面...");
            // 尝试获取数据
            const hasChat = typeof getChatMessages === 'function';
            let data = {};
            try {
                // 获取当前上下文数据
                const msgs = hasChat ? await getChatMessages(getCurrentMessageId()) : [];
                data = msgs?.[0]?.data?.stat_data || {};
            } catch(e) { console.log('Data fetch skipped', e); }
            
            // 合并默认数据，防止数据缺失导致报错
            currentData = deepMerge({
                'UI状态': {'当前界面': ['日常']}, 
                '世界': {'时间':['--:--']}, 
                '主角': {'资源':{'生命值':[100]}}
            }, data);
            
            renderAll();
        }
        
        // 兼容不同的加载环境 (网页版 / 移动端 / 本地测试)
        if (typeof waitGlobalInitialized === 'function') {
            waitGlobalInitialized('Mvu').then(() => {
                Init();
                // 监听数据更新事件
                if(typeof eventOn === 'function' && typeof Mvu !== 'undefined') {
                    eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, m => { 
                        if (m?.stat_data) { 
                            currentData = m.stat_data; 
                            renderAll(); 
                        } 
                    });
                }
            });
        } else { 
            // 如果是普通网页环境，直接启动
            // 使用 setTimeout 确保 DOM 元素已经由浏览器渲染完毕
            setTimeout(Init, 100);
        }
    })();
</script>
</body>
</html>
