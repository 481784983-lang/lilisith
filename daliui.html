<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>命运虚空 (V19 完美重制版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    /* --- [ 1. 艺术核心变量 ] --- */
    :root {
        --paper-bg: #E3D8C4;
        --paper-texture: url("https://www.transparenttextures.com/patterns/aged-paper.png");
        --ink-primary: #2B221E;
        --ink-secondary: #594A42;
        
        --gold-light: #D4AF37;
        --gold-dark: #8A6E25;
        --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        
        --accent-red: #8a0303; 
        --accent-blue: #1C305C; 
        --accent-purple: #4A235A; 
        --accent-green: #2E5902;

        --font-header: 'Cinzel Decorative', serif;
        --font-body: 'Cormorant Garamond', 'Noto Serif SC', serif;
    }

/* --- [ 全局重置 & 环境沉浸 ] --- */
    body {
        margin: 0; padding: 20px 10px;
        background-color: #0c0908;
        /* 暗黑木纹桌面与边缘暗角 */
        background-image: radial-gradient(circle at 50% 50%, transparent 0%, #000 120%), url("https://www.transparenttextures.com/patterns/dark-wood.png");
        font-family: var(--font-body);
        color: var(--ink-primary);
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; border: 1px solid rgba(0,0,0,0.5); }

    /* --- [ 典籍主容器 ] --- */
    #grimoire-container {
        max-width: 900px; margin: 0 auto;
        background-color: var(--paper-bg);
        background-image: var(--paper-texture);
        /* 提升书本的实体厚重感与皮革包边错觉 */
        border: 2px solid #4a3b33;
        outline: 6px solid #1a1512;
        outline-offset: -2px;
        box-shadow: 
            0 0 0 10px #0a0806,
            0 30px 80px rgba(0,0,0,0.9), 
            inset 0 0 100px rgba(43, 34, 30, 0.2);
        position: relative;
        min-height: 750px;
        display: flex; flex-direction: column;
        padding: 5px;
        border-radius: 4px;
    }

    /* 装饰纹样 */
    .corner-art { position: absolute; width: 40px; height: 40px; border: 2px solid var(--gold-dark); z-index: 0; pointer-events: none; }
    .corner-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
    .corner-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
    .corner-br { bottom: 16px; right: 16px; border-left: none; border-top: none; }
    .corner-art::after { content: '❖'; position: absolute; font-size: 20px; color: var(--gold-dark); }
    .corner-tl::after { top: -8px; left: -5px; } .corner-tr::after { top: -8px; right: -5px; }
    .corner-bl::after { bottom: -8px; left: -5px; } .corner-br::after { bottom: -8px; right: -5px; }

    /* --- [ Header: 星盘仪视窗 ] --- */
    .astral-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 25px 20px 20px 20px; 
        border-bottom: 3px double var(--gold-dark);
        margin-bottom: 15px; position: relative; z-index: 2;
        background: linear-gradient(to bottom, rgba(138, 110, 37, 0.08), transparent);
    }
    .astral-header::before {
        content: ""; position: absolute; bottom: -5px; left: 15%; right: 15%;
        height: 1px; background: radial-gradient(circle, var(--gold-dark) 0%, transparent 100%);
    }
    .header-side { display: flex; flex-direction: column; gap: 8px; }
    .header-left { align-items: flex-start; }
    .header-right { align-items: flex-end; }
    .header-center { text-align: center; flex: 1; padding: 0 10px; min-width: 0; }
    
    .header-data { 
        font-family: var(--font-header); font-weight: 700; color: var(--ink-secondary); 
        font-size: 0.9em; display: flex; align-items: center; gap: 6px; letter-spacing: 1px;
    }
    .header-data i { color: var(--gold-dark); font-size: 1.1em; width: 18px; text-align: center; }
    
    .loc-main {
        font-family: 'Cinzel Decorative', serif;
        font-size: clamp(1.5em, 5vw, 2.2em); font-weight: 900;
        color: var(--ink-primary);
        text-shadow: 1px 1px 0 rgba(255,255,255,0.8), 0 0 15px rgba(212, 175, 55, 0.3);
        letter-spacing: 3px; line-height: 1.1; margin-top: 4px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .loc-sub { font-family: var(--font-header); font-size: 0.7em; color: var(--gold-dark); text-transform: uppercase; letter-spacing: 3px; font-weight: bold; }

    /* --- [ Nav: 实体法器符文 ] --- */
    .rune-nav { 
        display: flex; justify-content: center; flex-wrap: wrap; gap: 25px; 
        padding: 10px 20px 30px 20px; position: relative; z-index: 10; 
    }
    .rune-btn {
        width: 55px; height: 55px; border-radius: 50%;
        background: linear-gradient(145deg, #2b221e 0%, #110d0a 100%);
        border: 2px solid #000;
        box-shadow: 
            0 5px 10px rgba(0,0,0,0.8), 
            inset 0 2px 4px rgba(255,255,255,0.15),
            0 0 0 1px rgba(138, 110, 37, 0.3);
        color: var(--gold-dark); 
        display: flex; align-items: center; justify-content: center; font-size: 1.3em;
        cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        position: relative;
    }
    /* 金属底座槽 */
    .rune-btn::before { 
        content: ""; position: absolute; top: -7px; left: -7px; right: -7px; bottom: -7px;
        border-radius: 50%; border: 1px dashed rgba(138, 110, 37, 0.3); z-index: -1;
        transition: 0.4s;
    }
    .rune-btn:hover { 
        transform: translateY(-4px); 
        color: var(--gold-light); 
        box-shadow: 0 8px 15px rgba(0,0,0,0.9), inset 0 0 20px rgba(212, 175, 55, 0.4), 0 0 0 1px var(--gold-dark); 
    }
    .rune-btn:hover::before { transform: rotate(90deg); border-style: solid; border-color: rgba(138, 110, 37, 0.2); }
    .rune-btn.active {
        background: radial-gradient(circle at center, #594a3a 0%, #1a1512 80%);
        color: #fff; 
        border-color: var(--gold-light); 
        transform: scale(1.15) translateY(-2px);
        box-shadow: 
            0 10px 20px rgba(0,0,0,0.8), 
            0 0 30px rgba(212, 175, 55, 0.7), 
            inset 0 0 25px rgba(212, 175, 55, 0.9);
    }
    .rune-btn.active i { filter: drop-shadow(0 0 6px #fff); }
    .rune-tooltip {
        position: absolute; bottom: -30px; font-family: var(--font-header); font-size: 0.7em; 
        color: var(--ink-primary); font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap;
        background: linear-gradient(to bottom, #fff, #f4efe4); padding: 3px 10px; border-radius: 2px; border: 1px solid var(--gold-dark);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); letter-spacing: 1px;
    }
    .rune-btn:hover .rune-tooltip, .rune-btn.active .rune-tooltip { opacity: 1; bottom: -35px; }

    /* --- [ Stage ] --- */
    .stage-container { flex-grow: 1; padding: 20px 30px; overflow-y: auto; position: relative; z-index: 5; }
    .fade-effect { animation: pageReveal 0.5s ease-out forwards; }
    @keyframes pageReveal { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }

    /* --- [ Components ] --- */
    h2.art-title { text-align: center; font-family: var(--font-header); font-size: 2em; color: var(--ink-primary); margin: 0 0 25px 0; text-transform: uppercase; letter-spacing: 2px; }
    h2.art-title::after { content: '— ❧ —'; display: block; font-size: 0.4em; color: var(--gold-dark); font-family: var(--font-body); margin-top: 5px; }

    /* 水晶进度条 */
    .crystal-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .crystal-casing { flex-grow: 1; height: 12px; background: #222; border: 1px solid #444; border-radius: 6px; position: relative; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); }
    .crystal-casing::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent); pointer-events: none; }
    .crystal-fluid { height: 100%; transition: width 0.6s ease; box-shadow: 0 0 8px currentColor; position: relative; }
    .crystal-fluid::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); background-size: 200% 100%; animation: fluidFlow 2s infinite linear; }
    @keyframes fluidFlow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }


    /* 1. 核心卡片容器：羊皮纸风格 */
    details.art-card {
        background: linear-gradient(to bottom, #fdfbf7, #f4efe4); /* 仿旧纸张渐变 */
        border: 1px solid rgba(138, 110, 37, 0.3); /* 暗金边框 */
        border-radius: 4px;
        margin-bottom: 16px;
        position: relative;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 2px 5px rgba(43, 34, 30, 0.05), 
                    inset 0 0 20px rgba(138, 110, 37, 0.02); /* 内发光营造质感 */
        overflow: hidden;
    }
    
    /* 悬停效果：浮起并增强金边 */
    details.art-card:hover {
        transform: translateY(-2px);
        border-color: rgba(138, 110, 37, 0.6);
        box-shadow: 0 8px 20px rgba(43, 34, 30, 0.15);
    }
    
    /* 展开状态：加深背景，增加沉浸感 */
    details.art-card[open] {
        background: #fffefb;
        border-color: var(--gold-dark);
        box-shadow: 0 5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(138, 110, 37, 0.1);
    }

    /* --- [ 红线对象专属设计：朱砂与恋慕 ] --- */
    details.art-card.destiny-mode {
        border-color: rgba(138, 3, 3, 0.2);
        background: linear-gradient(135deg, #fffbfb 0%, #fff0f0 100%);
    }
    details.art-card.destiny-mode:hover, details.art-card.destiny-mode[open] {
        border-color: var(--accent-red);
        box-shadow: 0 5px 20px rgba(138, 3, 3, 0.15);
    }
    /* 红线卡片背景纹理（爱心水印） */
    details.art-card.destiny-mode::before {
        content: "❤";
        position: absolute; right: -10px; top: -10px;
        font-size: 100px; color: var(--accent-red);
        opacity: 0.03; font-family: sans-serif;
        pointer-events: none; z-index: 0;
    }

    /* 2. 头部区域：古典标题栏 */
    summary.card-header-area {
        padding: 12px 18px;
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; list-style: none; user-select: none;
        background: rgba(0,0,0,0.02);
        border-bottom: 1px solid rgba(138, 110, 37, 0.1);
        transition: background 0.3s;
        position: relative; z-index: 1;
    }
    summary.card-header-area::-webkit-details-marker { display: none; }
    summary.card-header-area:hover { background: rgba(138, 110, 37, 0.05); }

    /* 头部名字设计 */
    .card-name-box { 
        font-family: 'Cinzel Decorative', serif; /* 华丽字体 */
        font-size: 1.3em; 
        color: var(--ink-primary); 
        font-weight: 700; 
        display: flex; align-items: baseline; 
        text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }
    .destiny-mode .card-name-box { 
        color: var(--accent-red); 
        text-shadow: 0 0 5px rgba(138, 3, 3, 0.1);
    }
    
    /* 头部图标装饰 */
    .card-name-box i {
        margin-right: 8px; 
        color: var(--gold-dark);
        font-size: 0.9em;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }
    .destiny-mode .card-name-box i { color: var(--accent-red); }

    /* 折叠指示器：金色箭头 */
    .fold-indicator {
        color: var(--gold-dark); opacity: 0.6;
        transition: transform 0.4s ease;
        font-size: 0.9em;
    }
    details[open] .fold-indicator { transform: rotate(180deg); opacity: 1; color: var(--accent-red); }

    /* 3. 内容区域 */
    .card-body-area { 
        padding: 15px 20px; 
        animation: slideDown 0.4s ease; 
        position: relative; z-index: 1;
        font-family: 'Cormorant Garamond', serif; /* 正文古典字体 */
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

/* --- [ 增强版：过渡与动画 ] --- */
    .fade-effect { animation: fadeInScale 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes fadeInScale { 
        from { opacity: 0; transform: translateY(10px) scale(0.98); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    /* 详情页展开动画 */
    details.art-card[open] .card-body-area {
        animation: expandOpen 0.5s ease-out;
    }
    @keyframes expandOpen {
        from { opacity: 0; transform: translateY(-10px); max-height: 0; }
        to { opacity: 1; transform: translateY(0); max-height: 1000px; }
    }

/* =========================================
       [ 1. 增强样式：大号好感度条与数值显示 ]
       ========================================= */
    .favor-progress-container {
        height: 20px; /* 加高 */
        background: #1a1a1a;
        border-radius: 10px;
        margin: 8px 0 15px 0;
        position: relative;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.2);
        border: 1px solid rgba(138, 110, 37, 0.4);
        overflow: hidden;
    }

    .favor-bar-fill {
        height: 100%;
        /* 默认正向好感：金色流光 */
        background: linear-gradient(180deg, #FEE140 0%, #D4AF37 50%, #8A6E25 100%);
        border-radius: 8px;
        transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        position: relative;
        z-index: 1;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }
    
    /* 进度条流光动画 */
    .favor-bar-fill::after {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shine 2s infinite linear;
    }
    @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* 数值文本层 (新增) */
    .favor-text-overlay {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.85em;
        color: #fff; text-shadow: 0 1px 3px #000, 0 0 5px #000;
        z-index: 2; letter-spacing: 1px; pointer-events: none;
    }

    /* 红线模式：红色 */
    .destiny-mode .favor-bar-fill {
        background: linear-gradient(180deg, #ff9a9e 0%, #ff5252 50%, #8a0303 100%);
        box-shadow: 0 0 10px rgba(229, 45, 39, 0.5);
    }

    /* 负好感模式：黑紫色 */
    .negative-mode .favor-bar-fill {
        background: linear-gradient(180deg, #9b59b6 0%, #4a235a 50%, #211226 100%);
        box-shadow: 0 0 10px rgba(74, 35, 90, 0.6);
    }
    .negative-mode .favor-progress-container {
        border-color: #4a235a;
    }

    /* =========================================
       [ 2. 增强样式：翻页与折叠动画 ]
       ========================================= */
    
    /* 页面载入/翻页时的淡入缩放 */
    .fade-effect { 
        animation: fadeInScale 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
    }
    @keyframes fadeInScale { 
        from { opacity: 0; transform: translateY(10px) scale(0.98); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    /* 折叠详情展开动画 */
    details.art-card[open] .card-body-area {
        animation: expandOpen 0.5s ease-out;
        transform-origin: top;
    }
    @keyframes expandOpen {
        from { opacity: 0; transform: translateY(-10px); max-height: 0; }
        to { opacity: 1; transform: translateY(0); max-height: 2000px; }
    }

    /* 分页按钮增强 */
    .pagination-ctrl {
        display: flex; justify-content: center; align-items: center;
        gap: 15px; margin-top: 20px; padding: 10px;
        border-top: 1px double var(--gold-dark);
        font-family: var(--font-header);
        animation: fadeIn 0.5s ease;
    }    /* 4. 属性网格：去掉边框，改用点阵引导线 */
    .detail-grid { 
        display: grid; grid-template-columns: repeat(2, 1fr); 
        gap: 8px 20px; 
    }
    .detail-item { 
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1px dotted rgba(138, 110, 37, 0.3); /* 金色虚线 */
        padding-bottom: 3px;
    }
    .detail-label { 
        font-family: 'Cinzel Decorative', serif; 
        color: var(--ink-secondary); 
        font-weight: bold; font-size: 0.8em; 
    }
    .detail-val { 
        font-weight: 600; color: var(--ink-primary); font-size: 1.05em; 
    }

    /* 5. 内心想法：手写体风格 */
    .inner-thought {
        margin-top: 15px; padding: 10px 15px; 
        background: rgba(74, 35, 90, 0.04);
        border-left: 3px solid var(--accent-purple);
        font-family: 'Cormorant Garamond', serif; 
        font-style: italic; font-size: 1.1em; line-height: 1.4;
        color: var(--accent-purple);
        position: relative; border-radius: 0 4px 4px 0;
    }
    .inner-thought::before { content: "❝"; position: absolute; top: -5px; left: 2px; font-size: 1.5em; opacity: 0.2; }

    /* 6. 华丽分割线 */
    .fancy-line {
        display: flex; align-items: center; justify-content: center;
        margin: 15px 0; color: var(--gold-dark); opacity: 0.6;
    }
    .fancy-line::before, .fancy-line::after {
        content: ""; flex: 1; height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
    }
    .fancy-line span { 
        padding: 0 10px; font-size: 1.2em; font-family: 'Cinzel Decorative', serif;
    }

    /* 7. 隐私与记忆的装饰块 */
    .art-badge {
        display: inline-flex; align-items: center; padding: 2px 8px; 
        border: 1px solid rgba(138, 110, 37, 0.4); 
        background: #fff; border-radius: 2px;
        font-family: 'Cinzel Decorative', serif; font-size: 0.75em; color: var(--ink-secondary);
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .erotic-tag { color: #8a0303; border-color: rgba(138, 3, 3, 0.3); background: rgba(138,3,3,0.02); }
    
    .art-text-block {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0,0,0,0.05); border-left: 2px solid var(--gold-dark);
        padding: 8px 12px; margin: 5px 0 10px 0;
        font-size: 0.95em; line-height: 1.6; color: #444;
        font-family: 'Noto Serif SC', serif;
    }
    .privacy-label {
        font-family: 'Cinzel Decorative', serif; color: var(--gold-dark); 
        font-weight: bold; font-size: 0.85em; margin-top: 10px; display: block;
    }

    /* 记忆回廊条目 */
    .memory-entry-art {
        background: linear-gradient(to right, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
        border-bottom: 1px solid rgba(138, 110, 37, 0.2);
        padding: 8px 10px; margin-bottom: 4px;
        transition: 0.3s; cursor: default;
    }
    .memory-entry-art:hover { background: #fff; padding-left: 15px; border-left: 2px solid var(--gold-dark); }
    .mem-title { font-weight: bold; color: var(--ink-primary); font-family: 'Cinzel Decorative', serif; font-size: 0.9em; }
    .mem-desc { font-size: 0.9em; color: #666; font-style: italic; margin-top: 2px; }

    /* 按钮微调 */
    .magic-btn {
        font-family: 'Cinzel Decorative', serif; letter-spacing: 1px;
        border: 1px solid var(--gold-dark); color: var(--gold-dark);
        background: transparent; padding: 4px 12px;
        transition: all 0.3s;
    }
    .magic-btn:hover {
        background: var(--gold-dark); color: #fff; 
        box-shadow: 0 0 10px rgba(138, 110, 37, 0.4);
    }
    .destiny-mode .magic-btn { border-color: var(--accent-red); color: var(--accent-red); }
    .destiny-mode .magic-btn:hover { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px rgba(138, 3, 3, 0.4); }

    /* 隐私与记忆的折叠Summary美化 */
    details > summary { outline: none; }
    details > summary i { width: 20px; text-align: center; }
    /* 标签页系统 (主角页) */
    .tab-header { display: flex; border-bottom: 1px solid var(--ink-secondary); margin-bottom: 15px; }
    .tab-btn { 
        padding: 8px 15px; background: transparent; border: none; font-family: var(--font-header);

    .rarity-传说 { border-color: #ffb300; color: #ffd54f; box-shadow: inset 0 0 20px rgba(255,179,0,0.4), 0 0 10px rgba(255,179,0,0.3); }
    .rarity-神话 { border-color: var(--accent-red); color: #ff5252; box-shadow: inset 0 0 20px rgba(138,3,3,0.5), 0 0 10px rgba(138,3,3,0.4); animation: pulseRed 2s infinite; }
    @keyframes pulseRed { 0%, 100% { box-shadow: inset 0 0 20px rgba(138,3,3,0.5), 0 0 10px rgba(138,3,3,0.4); } 50% { box-shadow: inset 0 0 30px rgba(138,3,3,0.8), 0 0 20px rgba(138,3,3,0.6); } }

    /* 物品详情悬浮视窗 (置顶) */
    .item-inspect-panel {
        background: linear-gradient(to bottom, #fffcf5, #f4efe4);
        border: 1px solid var(--gold-dark);
        padding: 20px; margin-bottom: 20px;
        border-radius: 2px; position: relative;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.9), inset 0 0 0 4px rgba(138, 110, 37, 0.1);
        animation: fadeIn 0.4s ease;
    }
    .item-inspect-panel::before {
        content: "✦"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
        background: var(--paper-bg); padding: 0 10px; color: var(--gold-dark); font-size: 1.4em;
    }
    .inspect-title { font-family: var(--font-header); font-size: 1.5em; font-weight: 900; color: var(--ink-primary); letter-spacing: 1px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px;}
    .inspect-meta { font-size: 0.85em; font-family: var(--font-header); color: var(--ink-secondary); border-bottom: 1px dashed var(--gold-dark); padding-bottom: 6px; margin-bottom: 12px; display: flex; gap: 15px;}
    .inspect-desc { font-family: 'Cormorant Garamond', serif; font-size: 1.1em; font-style: italic; color: #222; line-height: 1.6; margin-bottom: 20px; background: rgba(0,0,0,0.02); padding: 10px; border-left: 3px solid var(--gold-dark);}
    
    /* 分页控件微调 */
    .pagination-ctrl { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding: 10px; border-top: 1px double var(--gold-dark); font-family: var(--font-header); }
    .page-btn { background: transparent; border: 1px solid var(--gold-dark); color: var(--gold-dark); padding: 5px 12px; cursor: pointer; transition: 0.3s; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-btn:hover:not(:disabled) { background: var(--gold-dark); color: #fff; box-shadow: 0 0 10px rgba(138,110,37,0.4); }
/* =========================================
       [ 视觉升级包：奥术线条与花纹 ]
       ========================================= */
    #grimoire-container {
        /* 边框升级：双层金边 + 阴影 */
        border: 3px solid var(--ink-primary);
        outline: 4px double var(--gold-dark);
        outline-offset: -10px;
    }
    /* 2. 标题艺术：带翅膀的装饰线 */
    h2.art-title {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        color: var(--ink-primary);
        text-shadow: 1px 1px 0 rgba(212, 175, 55, 0.3);
    }
    h2.art-title::before, h2.art-title::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
        max-width: 100px;
        position: relative;
        top: 2px;
    }
    /* 标题下方的装饰花纹 (替换原有的简单文字) */
    h2.art-title::after { content: ""; } /* 清除旧的伪元素内容 */
    /* 我们用一个新的元素或者背景图来做装饰，这里用伪元素技巧 */
    .art-title-ornament {
        display: block;
        text-align: center;
        margin-top: -15px;
        margin-bottom: 20px;
        color: var(--gold-dark);
        font-family: var(--font-header);
        font-size: 1.2em;
        opacity: 0.8;
    }

    /* 3. 卡片升级：增加“羊皮纸缝线”和角落花纹 */
    details.art-card {
        background: #fffbf0;
        border: none; /*以此重置旧边框*/
        position: relative;
        /* 使用 box-shadow 模拟多重边框 */
        box-shadow: 
            0 0 0 1px rgba(138, 110, 37, 0.3),
            inset 0 0 0 3px rgba(255, 255, 255, 0.5),
            inset 0 0 0 4px rgba(138, 110, 37, 0.2),
            0 4px 10px rgba(0,0,0,0.05);
        margin-bottom: 20px;
    }
    
    /* 独特的角落装饰 (使用 CSS 绘制三角形装饰) */
    details.art-card::after {
        content: "";
        position: absolute;
        top: 0; right: 0;
        border-width: 0 30px 30px 0;
        border-style: solid;
        border-color: transparent rgba(138, 110, 37, 0.1) transparent transparent;
        pointer-events: none;
    }

    /* 4. 更加华丽的分割线 (Victorian Divider) */
    .art-divider {
        margin: 25px 0;
        border: none;
        height: 20px;
        background: none;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
    }
    .art-divider::before, .art-divider::after {
        content: "";
        width: 40%;
        height: 1px;
        background: var(--ink-secondary);
        opacity: 0.3;
    }
    .art-dot {
        font-family: var(--font-header);
        font-size: 1.4em;
        color: var(--gold-dark);
        padding: 0 15px;
        position: relative;
        top: -2px;
    }
    /* 增加菱形装饰 */
    .art-dot::before {
        content: "❖";
        font-size: 0.8em;
        margin-right: 5px;
        color: var(--ink-secondary);
    }
    .art-dot::after {
        content: "❖";
        font-size: 0.8em;
        margin-left: 5px;
        color: var(--ink-secondary);
    }

    /* 5. 按钮升级：宝石镶嵌风格 */
    .magic-btn {
        border: 1px solid var(--gold-dark);
        background: linear-gradient(to bottom, #fff, #f4efe4);
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: all 0.3s ease;
    }
    /* 悬停时的流光效果 */
    .magic-btn::before {
        content: "";
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
        transition: left 0.5s;
        z-index: -1;
        transform: skewX(-20deg);
    }
    .magic-btn:hover::before {
        left: 100%;
    }
    .magic-btn:hover {
        border-color: var(--ink-primary);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        transform: translateY(-1px);
    }

    /* 6. 特殊：红线卡片的玫瑰纹理 */
    details.art-card.destiny-mode {
        background-image: 
            radial-gradient(var(--accent-red) 1px, transparent 1px),
            radial-gradient(var(--accent-red) 1px, transparent 1px);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
        background-color: #fff5f5;
        /* 让背景点非常淡 */
        background-blend-mode: overlay; 
        /* 修复背景图片覆盖问题，这里只用超淡的透明度 */
    }
    details.art-card.destiny-mode::before {
        /* 覆盖原来的爱心，改用更复杂的纹样 */
        content: "❦";
        font-size: 120px;
        top: -30px; right: -20px;
        opacity: 0.05;
        color: var(--accent-red);
        transform: rotate(15deg);
    }

    /* 7. 角落装饰增强 (覆盖原有的 corner-art) */
    .corner-art {
        border: none; /* 去掉简单的线框 */
        width: 60px; height: 60px;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2,2 L2,20 M2,2 L20,2' stroke='%238A6E25' stroke-width='3' fill='none'/%3E%3Cpath d='M5,5 L5,15 M5,5 L15,5' stroke='%232B221E' stroke-width='1' fill='none'/%3E%3Ccircle cx='5' cy='5' r='2' fill='%238A6E25'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        opacity: 0.8;
    }
    .corner-tr { transform: rotate(90deg); }
    .corner-br { transform: rotate(180deg); }
    .corner-bl { transform: rotate(270deg); }
    /* 隐藏原有的 ::after 符号，因为我们用了 SVG */
    .corner-art::after { display: none; }
    /* =========================================
       [ 优雅线条增强包：只做细化，保持原味 ]
       请将此代码粘贴到 <style> 的最后面
       ========================================= */

    /* 1. 升级角落装饰：从“方框”变为“维多利亚花纹” */
    .corner-art {
        border: none; /* 去掉原来的实线边框 */
        width: 50px; height: 50px;
        opacity: 0.7;
        background-size: contain;
        background-repeat: no-repeat;
        /* 使用 SVG 矢量花纹，像钢笔画上去的 */
        background-image: url("data:image/svg+xml,%3Csvg width='50' height='50' viewBox='0 0 50 50' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2,50 L2,15 Q2,2 15,2 L50,2' fill='none' stroke='%238A6E25' stroke-width='2'/%3E%3Cpath d='M5,50 L5,20 Q5,5 20,5 L50,5' fill='none' stroke='%23594A42' stroke-width='1'/%3E%3Ccircle cx='5' cy='5' r='2' fill='%238A6E25'/%3E%3Cpath d='M15,15 L25,5' stroke='%238A6E25' stroke-width='1'/%3E%3C/svg%3E");
    }
    /* 旋转角落以适配四个角 */
    .corner-tr { transform: scaleX(-1); }
    .corner-bl { transform: scaleY(-1); }
    .corner-br { transform: scale(-1); }
    /* 隐藏原本的文字符号 */
    .corner-art::after { display: none; }

    /* 2. 升级标题修饰：增加底部精致的长线条 */
    h2.art-title {
        margin-bottom: 30px;
        position: relative;
    }
    /* 在标题下方添加一条精致的艺术线 */
    h2.art-title::after {
        content: "";
        display: block;
        width: 60%; /* 线条宽度 */
        height: 15px;
        margin: 5px auto 0 auto;
        /* 一个两端渐隐、中间有菱形的线条 */
        background-image: url("data:image/svg+xml,%3Csvg width='200' height='10' viewBox='0 0 200 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='0' y1='5' x2='200' y2='5' stroke='%238A6E25' stroke-width='1' stroke-dasharray='190, 10'/%3E%3Crect x='95' y='0' width='10' height='10' transform='rotate(45 100 5)' fill='%238A6E25'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.6;
    }

    /* 3. 升级分割线：从“直线”变为“花纹分隔符” */
    .fancy-line, .art-divider {
        height: 20px;
        border: none;
        background: none;
        position: relative;
        opacity: 0.5;
    }
    /* 覆盖原有的 ::before/::after 直线 */
    .fancy-line::before, .fancy-line::after,
    .art-divider::before, .art-divider::after {
        display: none;
    }
    /* 使用居中的古典花纹 */
    .fancy-line {
        background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='10' preserveAspectRatio='none' viewBox='0 0 200 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='0' y1='5' x2='200' y2='5' stroke='%23594A42' stroke-width='1' stroke-opacity='0.5'/%3E%3Ccircle cx='100' cy='5' r='3' fill='%238A6E25'/%3E%3Ccircle cx='90' cy='5' r='1' fill='%23594A42'/%3E%3Ccircle cx='110' cy='5' r='1' fill='%23594A42'/%3E%3C/svg%3E");
        background-position: center;
        background-repeat: no-repeat;
    }

    /* 4. 卡片微调：增加极其细微的“内描边”，提升精致度 */
    details.art-card {
        /* 在原有的边框基础上，增加一道极细的内线，像纸张压痕 */
        box-shadow: inset 0 0 0 1px rgba(138, 110, 37, 0.15);
    }
    
    /* 5. 按钮微调：增加边框的双线感 */
    .magic-btn {
        border: 1px double var(--gold-dark); /* 简单的实线改为双线 */
        font-weight: bold;
    }
    
    /* 6. 属性列表：虚线变细，更像手账 */
    .detail-item {
        border-bottom: 1px dashed rgba(138, 110, 37, 0.2);
    }
    /* =========================================
   [ 弹出式古籍卡片 (NPC 档案卷宗) ]
   ========================================= */
#npc-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 10, 8, 0.75);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 9999;
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

#npc-modal-overlay.active {
    opacity: 1; pointer-events: auto;
}

/* =========================================
   [ 终极质感：殿堂级奥术档案卷宗 ]
   ========================================= */

/* 1. 弹窗本体：3D浮雕与呼吸光斑 */
.npc-modal-card {
    --t-base: #f5f0e6;
    --t-border: #1a1614;
    --t-outline: #8A6E25;
    --t-glow: rgba(212, 175, 55, 0.4);
    
    background: 
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.6) 0%, transparent 60%), /* 顶部高光 */
        radial-gradient(circle at 50% 100%, rgba(0,0,0,0.1) 0%, transparent 60%), /* 底部暗角 */
        var(--paper-texture),
        var(--t-base);
    width: 92%; max-width: 520px; 
    
    /* 复杂的实体书卷边框伪造 */
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 
        0 0 0 2px var(--t-border),
        0 0 0 6px var(--t-base),
        0 0 0 8px var(--t-outline),
        0 40px 100px rgba(0,0,0,0.9), 
        inset 0 0 80px rgba(138, 110, 37, 0.15);
        
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    animation: modalFloat 6s ease-in-out infinite alternate;
}

@keyframes modalFloat {
    0% { box-shadow: 0 0 0 2px var(--t-border), 0 0 0 6px var(--t-base), 0 0 0 8px var(--t-outline), 0 30px 80px rgba(0,0,0,0.8), inset 0 0 60px rgba(138, 110, 37, 0.1); }
    100% { box-shadow: 0 0 0 2px var(--t-border), 0 0 0 6px var(--t-base), 0 0 0 8px var(--t-outline), 0 50px 120px rgba(0,0,0,0.95), inset 0 0 100px rgba(138, 110, 37, 0.25); }
}

/* 修复：增加滚动条与限制高度 */
.modal-content-wrapper { 
    padding: 50px 25px 40px 25px; 
    max-height: 80vh; 
    overflow-y: auto; 
    position: relative;
    z-index: 2;
}
/* 定制优美的暗金滚动条 */
.modal-content-wrapper::-webkit-scrollbar { width: 4px; }
.modal-content-wrapper::-webkit-scrollbar-thumb { background: var(--t-outline); border-radius: 2px; }

/* 修复：补回华丽的关闭按钮 */
.modal-close-btn {
    position: absolute; top: 15px; right: 20px;
    font-size: 2.2em; color: var(--t-outline); cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 1.5, 0.5, 1);
    z-index: 100; font-family: var(--font-header); line-height: 1;
    text-shadow: 0 0 10px var(--t-glow);
}
.modal-close-btn:hover { 
    transform: rotate(90deg) scale(1.2); color: var(--accent-red); 
}

/* 2. 姓名：真·流光金箔效果 */
.npc-modal-card .card-name-box {
    justify-content: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 2.6em;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 8px;
    
    /* 金箔流光核心代码 */
    background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    background-size: 200% auto;
    color: #000;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    animation: goldShine 4s linear infinite;
}

@keyframes goldShine {
    to { background-position: 200% center; }
}

/* 红线变体：深渊泣血字体 */
.theme-destiny .card-name-box {
    background: linear-gradient(to right, #8a0303, #ff5252, #8a0303, #ff9a9e, #4a0202);
    background-size: 200% auto;
    -webkit-background-clip: text;
    filter: drop-shadow(0 0 15px rgba(138, 3, 3, 0.8));
    animation: bloodPulse 3s linear infinite;
}
@keyframes bloodPulse { to { background-position: 200% center; } }

/* 3. 史诗感副标题与魔法阵分割线 */
.npc-modal-card .modal-meta-info {
    font-family: var(--font-header);
    font-size: 0.9em; color: var(--ink-secondary);
    letter-spacing: 6px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 15px;
    opacity: 0.8;
}
.npc-modal-card .modal-meta-info::before, .npc-modal-card .modal-meta-info::after {
    content: "✦"; font-size: 0.8em; color: var(--t-outline);
}

/* 4. 属性网格：悬浮互动质感 */
.npc-modal-card .detail-grid {
    display: grid; 
    /* 修复核心：自适应列宽，手机端自动变单列，防止文字挤压 */
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
    gap: 15px 20px;
    margin: 35px 0; padding: 18px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(138, 110, 37, 0.3);
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
}
.npc-modal-card .detail-item {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px dotted rgba(138, 110, 37, 0.4);
    padding: 6px 4px;
    transition: all 0.3s;
}
.npc-modal-card .detail-item:hover {
    background: linear-gradient(90deg, transparent, rgba(138, 110, 37, 0.1), transparent);
    transform: scale(1.02);
    border-bottom-color: var(--t-outline);
}
.npc-modal-card .detail-label { font-size: 0.8em; font-family: var(--font-header); color: var(--ink-secondary); font-weight: 900;}
.npc-modal-card .detail-val { font-size: 1.1em; font-family: var(--font-body); color: var(--ink-primary); font-weight: bold; text-shadow: 0 1px 1px #fff; }

/* 5. 内心想法：神秘手书残片 */
.npc-modal-card .inner-thought {
    margin: 35px -15px; padding: 25px 30px;
    background: linear-gradient(to right, rgba(43, 34, 30, 0.05), rgba(43, 34, 30, 0.01));
    border-left: 4px solid var(--t-outline);
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3em; line-height: 1.7;
    color: var(--ink-primary); position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.03);
}
.npc-modal-card .inner-thought::before {
    content: "❝"; position: absolute; top: -15px; left: 10px;
    font-size: 4em; color: var(--t-outline); opacity: 0.2; font-family: serif; line-height: 1;
}

/* 6. 细条流光好感度 */
.npc-modal-card .favor-progress-container {
    height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; 
    border: none; margin-top: 15px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    overflow: visible; /* 允许光效溢出 */
}
.npc-modal-card .favor-bar-fill { 
    height: 100%; border-radius: 2px; position: relative;
    box-shadow: 0 0 15px var(--t-glow);
}
/* 进度条前端的光斑 */
.npc-modal-card .favor-bar-fill::after {
    content: ""; position: absolute; right: -5px; top: -3px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px 4px var(--t-glow);
}

/* 7. 隐私标签：奢侈品铭牌风格 */
.privacy-label {
    display: inline-block; padding: 5px 15px;
    background: var(--t-border); color: var(--t-base);
    font-family: var(--font-header); font-size: 0.85em; letter-spacing: 2px;
    border: 1px solid var(--t-outline);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.art-text-block {
    background: rgba(255,255,255,0.6); padding: 15px;
    border: 1px solid rgba(138, 110, 37, 0.2);
    border-radius: 2px; box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
}
.modal-action-row {
    display: flex; justify-content: center; gap: 20px; margin-top: 30px;
}
.modal-action-row .stamp-btn {
    border-color: var(--t-text-main); color: var(--t-text-main);
}
.modal-action-row .stamp-btn:hover {
    background: var(--t-text-main); color: var(--paper-bg); box-shadow: 0 0 15px var(--t-glow);
}


/* =========================================
   [ 动态五段情绪主题映射 ]
   ========================================= */

/* 1. 中立 (默认 0~299) 沿用根变量，无需覆写 */
.theme-neutral {}

/* 2. 敌对/负面 (< 0) - 幽暗、破败 */
.theme-hostile {
    --t-border: #1a0b1c;
    --t-outline: #5c3a6b;
    --t-text-main: #3d1c4a;
    --t-text-sub: #6c5875;
    --t-glow: rgba(92, 58, 107, 0.3);
    --t-bar-fill: linear-gradient(90deg, #4a235a, #8e44ad);
}
.theme-hostile .modal-ambient-fx {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at top right, rgba(92,58,107,0.1), transparent 60%);
    pointer-events: none;
}

/* 3. 友善 (300~799) - 生机、翠绿 */
.theme-friendly {
    --t-border: #1c3605;
    --t-outline: #4d8015;
    --t-text-main: #2E5902;
    --t-text-sub: #5f7a43;
    --t-glow: rgba(77, 128, 21, 0.2);
    --t-bar-fill: linear-gradient(90deg, #7cb342, #c0ca33);
}

/* 4. 倾心/暧昧 (800+) - 柔情、玫瑰金 */
.theme-intimate {
    --t-border: #802640;
    --t-outline: #c45270;
    --t-text-main: #a33252;
    --t-text-sub: #9e6d7a;
    --t-glow: rgba(196, 82, 112, 0.25);
    --t-bar-fill: linear-gradient(90deg, #e57373, #f48fb1);
}
.theme-intimate .modal-ambient-fx {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to top, rgba(196,82,112,0.1), transparent);
    pointer-events: none;
}

/* 5. 命运羁绊 (红线专属) - 极致血色与流光 */
.theme-destiny {
    --t-base: #fffafb;
    --t-border: rgba(138, 3, 3, 0.9);
    --t-outline: var(--accent-red);
    --t-text-main: var(--accent-red);
    --t-text-sub: rgba(138, 3, 3, 0.7);
    --t-glow: rgba(138, 3, 3, 0.35);
    --t-bar-fill: linear-gradient(90deg, #d32f2f, #ff5252);
}
.theme-destiny .card-name-box {
    font-size: 2.4em; font-weight: 900;
}
/* 红线专属：背景心跳波动特效 */
.theme-destiny .modal-ambient-fx {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(circle at 50% 50%, rgba(138,3,3,0.05) 0%, transparent 70%);
    animation: destinyPulse 3s infinite ease-in-out;
    pointer-events: none;
}
@keyframes destinyPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.5); opacity: 1; }
}

/* --- 四周角落图腾 (根据主题颜色自适应) --- */
.npc-modal-card::before, .npc-modal-card::after {
    content: "❖"; position: absolute; font-size: 1.8em; 
    color: var(--t-outline); opacity: 0.9;
    text-shadow: 0 0 10px var(--t-glow);
}
.npc-modal-card::before { top: 6px; left: 8px; }
.npc-modal-card::after { bottom: 6px; right: 8px; }

/* 红线角落变更为心形 */
.theme-destiny::before, .theme-destiny::after {
    content: "❦"; font-size: 2.2em; animation: destinyPulse 2s infinite;
}
/* =========================================
   [ 异世界风味改造：行囊与任务展开 ]
   ========================================= */

/* --- 行囊展开内部：炼金术士的笔记 --- */
.bag-item-details {
    background: linear-gradient(to bottom, #f9f6ef 0%, #f1e9d0 100%);
    border-top: 2px groove var(--gold-dark); /* 凹槽金属线 */
    border-bottom: 2px groove var(--gold-dark);
    padding: 18px 20px;
    font-size: 0.95em;
    position: relative;
    box-shadow: inset 0 0 20px rgba(138, 110, 37, 0.1);
    /* 增加一个非常淡的魔法阵或墨迹背景 */
    background-image: 
        radial-gradient(circle at center, rgba(138, 110, 37, 0.03) 0%, transparent 60%),
        var(--paper-texture);
}

/* 顶部中间的复古连接饰品 */
.bag-item-details::before {
    content: "✦";
    position: absolute;
    top: -12px; left: 50%; transform: translateX(-50%);
    color: var(--gold-dark);
    background: var(--paper-bg); /* 遮挡住底下的线 */
    padding: 0 10px;
    font-size: 1.2em;
}

/* 物品描述字体：手写体/古籍体 */
.item-lore-text {
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-style: italic;
    color: var(--ink-secondary);
    line-height: 1.6;
    text-align: center;
    margin-bottom: 15px;
    position: relative;
}
.item-lore-text::before, .item-lore-text::after {
    content: '〜';
    color: var(--gold-dark);
    opacity: 0.5;
    margin: 0 5px;
}

/* --- 任务展开内部：羊皮卷轴与公会蜡封 --- */
.quest-details-wrapper {
    background: #faf8f2;
    background-image: var(--paper-texture);
    border: 1px solid rgba(138, 110, 37, 0.4);
    padding: 15px 20px 20px 20px;
    margin-top: 5px;
    position: relative;
    box-shadow: 
        inset 0 0 15px rgba(0,0,0,0.03),
        2px 2px 5px rgba(0,0,0,0.05);
}

/* 模拟卷轴折角 */
.quest-details-wrapper::after {
    content: ""; position: absolute; bottom: 0; right: 0;
    border-width: 0 25px 25px 0; border-style: solid;
    border-color: transparent transparent var(--paper-bg) transparent;
    box-shadow: -2px -2px 3px rgba(0,0,0,0.05);
}

/* 公会目标指示线 */
.quest-target-box {
    border-left: 3px double var(--gold-dark);
    padding-left: 12px;
    margin-bottom: 15px;
}
.quest-target-label {
    font-family: var(--font-header);
    color: var(--ink-secondary);
    font-size: 0.85em;
    letter-spacing: 1px;
}
.quest-target-value {
    color: var(--accent-red); /* 用血色突出目标 */
    font-weight: 900;
    font-size: 1.1em;
}

/* --- 奖励标签的“奇幻化” (去掉现代药丸样式，改为钱币/图章) --- */
.reward-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent;
    border: 1px solid var(--gold-dark);
    border-radius: 0; /* 摒弃现代圆角 */
    padding: 3px 10px;
    font-family: var(--font-header);
    color: var(--ink-primary);
    position: relative;
    box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.15);
}
/* 奖励标签两端的铆钉 */
.reward-badge::before, .reward-badge::after {
    content: "·"; position: absolute; top: 50%; transform: translateY(-50%); color: var(--gold-dark);
}
.reward-badge::before { left: 2px; } .reward-badge::after { right: 2px; }

/* 惩罚警告：血誓墨迹 */
.quest-penalty {
    margin-top: 15px;
    font-family: var(--font-header);
    color: var(--accent-red);
    font-size: 0.85em;
    text-align: right;
    border-top: 1px dashed rgba(138, 3, 3, 0.3);
    padding-top: 5px;
}
/* =========================================
       [ 全新升级包：领域探索地图排版 (适配修复版) ]
       ========================================= */
    .map-grid-container {
        display: grid;
        /* 【关键修改】：卡片最小宽度缩减为 240px，使其在 900px 容器内能从容放下 2-3 列，手机端也不会溢出 */
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        padding: 2px;
    }

    .map-location-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(244, 239, 228, 0.9) 100%);
        border: 1px solid rgba(138, 110, 37, 0.4);
        border-left: 4px solid var(--gold-dark);
        border-radius: 4px;
        padding: 12px; /* 减少卡片内边距 */
        position: relative;
        box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .map-location-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(43, 34, 30, 0.12);
        border-left-color: var(--accent-red);
        background: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(253, 251, 247, 1) 100%);
    }

    /* 顶部标题与按钮布局 */
    .map-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center; /* 改为居中对齐，避免错位 */
        border-bottom: 1px dashed rgba(138, 110, 37, 0.3);
        padding-bottom: 8px;
    }

    .map-loc-title {
        font-family: var(--font-header);
        font-size: 1.15em; /* 稍微缩小地名 */
        font-weight: 900;
        color: var(--ink-primary);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis; /* 如果名字太长自动加省略号 */
    }

    /* 出发按钮瘦身 */
    .map-go-btn {
        background: var(--ink-primary);
        color: #fff;
        border: none;
        border-radius: 15px;
        padding: 4px 10px; /* 减少按钮占用的体积 */
        font-size: 0.75em;
        font-family: var(--font-header);
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
        flex-shrink: 0; /* 防止按钮被挤压变形 */
    }

    .map-go-btn:hover {
        background: var(--accent-red);
        box-shadow: 0 4px 10px rgba(138, 3, 3, 0.4);
    }

    /* 标签排版艺术化 - 紧凑版 */
    .map-tags-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px; /* 缩小标签之间的间距 */
    }

    .map-env-tag {
        display: inline-flex;
        align-items: center;
        gap: 3px; /* 缩小图标和文字的间距 */
        font-size: 0.7em; /* 减小字号 */
        font-weight: bold;
        padding: 2px 6px; /* 大幅减少内边距 */
        border-radius: 8px; 
        border: 1px solid;
        letter-spacing: normal; /* 取消原先的字间距拉伸 */
        font-family: 'Noto Serif SC', serif;
        white-space: nowrap; /* 确保标签内不换行 */
    }

    /* 描述排版 */
    .map-loc-desc {
        font-family: var(--font-body);
        font-size: 0.85em; /* 描述文字略微调小 */
        color: var(--ink-secondary);
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.03);
        border-left: 2px solid rgba(138, 110, 37, 0.2);
        padding: 8px 10px;
        border-radius: 0 4px 4px 0;
        flex-grow: 1;
        font-style: italic;
    }
/* =========================================
       [ 皇家档案：人脉与红线专属绝密卷宗 (紧凑优雅版) ]
       ========================================= */
    .royal-roster-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
        gap: 10px; /* 缩小间距 */
        padding: 5px;
    }

    .royal-roster-card {
        background: linear-gradient(135deg, #fdfbf7 0%, #f4efe4 100%);
        border: 1px solid var(--gold-dark);
        border-radius: 2px;
        padding: 10px 12px; /* 缩减上下内边距，使整体更扁平紧凑 */
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        box-shadow: 
            inset 0 0 0 1px rgba(255,255,255,0.8),
            inset 0 0 0 3px rgba(138, 110, 37, 0.15),
            0 2px 5px rgba(0,0,0,0.05);
        display: flex;
        align-items: center; /* 确保左右元素垂直居中 */
        overflow: hidden;
    }

    /* 背景暗纹：皇家徽记水印 */
    .royal-roster-card::before {
        content: "⚜";
        position: absolute;
        right: -10px;
        bottom: -20px;
        font-size: 80px; /* 稍微缩小水印 */
        color: var(--gold-dark);
        opacity: 0.03;
        transform: rotate(-15deg);
        pointer-events: none;
    }

    .royal-roster-card:hover {
        transform: translateY(-2px);
        background: #fff;
        box-shadow: 
            inset 0 0 0 1px rgba(255,255,255,0.9),
            inset 0 0 0 3px rgba(138, 110, 37, 0.3),
            0 8px 15px rgba(43, 34, 30, 0.1);
    }

    /* 火漆印章风格头像框 (稍微缩小) */
    .royal-seal {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2b221e 0%, #4a3b33 100%);
        border: 2px solid var(--gold-light);
        display: flex; justify-content: center; align-items: center;
        font-size: 1.1em;
        color: var(--gold-light);
        flex-shrink: 0;
        box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.2);
        position: relative; z-index: 1;
    }

    /* 中间信息区 (核心修复点：强制左对齐，控制行高，截断超长文本) */
    .royal-details {
        margin-left: 12px;
        flex-grow: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px; 
        text-align: left; /* 【修复】强制左对齐，解决“太靠右、显得蠢”的问题 */
    }

    .royal-name {
        font-family: var(--font-header);
        font-weight: 900;
        font-size: 1.05em; /* 稍微缩小字号 */
        color: var(--ink-primary);
        line-height: 1.2;
        /* 允许最多换行两行，超出则省略号 */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 1px;
        text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    /* 破除标签，化作史诗头衔 */
    .royal-epithet {
        font-size: 0.7em;
        font-family: var(--font-header);
        color: var(--gold-dark);
        line-height: 1.2;
        white-space: nowrap; /* 列表里强制单行，点击后弹窗看详情 */
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.9;
    }

    /* 手写体羽毛笔批注 */
    .royal-annotation {
        font-size: 0.8em;
        font-family: var(--font-body);
        color: #1C305C; 
        font-style: italic;
        line-height: 1.3;
        white-space: nowrap; /* 【修复】列表里强制单行，防止卡片被撑得无限大 */
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .royal-annotation::before {
        content: "❝ "; /* 将双引号内联，去掉 absolute 定位，避免排版错乱 */
        font-size: 1.1em;
        color: var(--gold-dark);
        opacity: 0.8;
    }

    /* 精致数值区 */
    .royal-favor-box {
        text-align: center;
        flex-shrink: 0;
        margin-left: 8px;
        padding-left: 10px; 
        border-left: 1px solid rgba(138, 110, 37, 0.2);
        position: relative;
    }
    .royal-favor-box::before { 
        content: "✦"; position: absolute; left: -5px; top: 50%; transform: translateY(-50%);
        font-size: 8px; color: var(--gold-dark); background: #fdfbf7;
    }

    .royal-favor-word {
        font-size: 0.65em; font-family: var(--font-header); color: var(--ink-secondary);
        letter-spacing: 2px; margin-bottom: 2px;
    }

    .royal-favor-num {
        font-size: 1.1em; font-weight: bold; font-family: 'Courier New', monospace;
        color: var(--ink-primary);
    }

    /* --- 命运红线专属变体：腥红印记与玫瑰纹章 --- */
    .royal-roster-card.red-line-theme {
        border-color: rgba(138, 3, 3, 0.3);
        background: linear-gradient(135deg, #fffafb 0%, #fff0f0 100%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), inset 0 0 0 3px rgba(138, 3, 3, 0.1), 0 2px 5px rgba(0,0,0,0.05);
    }
    .royal-roster-card.red-line-theme::before { content: "❦"; color: var(--accent-red); opacity: 0.03; }
    .royal-roster-card.red-line-theme:hover { border-color: var(--accent-red); box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 3px rgba(138, 3, 3, 0.2), 0 8px 15px rgba(138, 3, 3, 0.1); }
    
    .royal-roster-card.red-line-theme .royal-seal {
        background: linear-gradient(135deg, #4a0202 0%, #8a0303 100%);
        border-color: #ff9a9e; color: #ff9a9e;
    }
    .royal-roster-card.red-line-theme .royal-name { color: var(--accent-red); }
    .royal-roster-card.red-line-theme .royal-epithet { color: #a33252; }
    .royal-roster-card.red-line-theme .royal-annotation { color: #802640; }
    .royal-roster-card.red-line-theme .royal-favor-box { border-left-color: rgba(138, 3, 3, 0.2); }
    .royal-roster-card.red-line-theme .royal-favor-box::before { color: var(--accent-red); background: #fffafb; content: "♦"; }
    .royal-roster-card.red-line-theme .royal-favor-word { color: #a33252; }
    .royal-roster-card.red-line-theme .royal-favor-num { color: var(--accent-red); }
/* =========================================
       [ 细节修缮与重构：塔罗牌与绝密档案 ]
       ========================================= */
       
    /* 1. 修复地点不换行，允许文字自然折行 */
    .loc-main {
        white-space: normal !important;
        word-wrap: break-word !important;
        line-height: 1.2 !important;
    }

    /* 2. 修复人脉卡片靠右（干掉多余的 padding，居中对齐） */
    .royal-roster-grid {
        padding: 5px 0 !important;
        justify-items: center !important; 
    }
    .royal-roster-card { width: 100%; box-sizing: border-box; }
    
    /* 3. 修复新闻标红乱码 (剥离行内样式，改为专属 Class) */
    .news-highlight-text {
        color: var(--accent-red) !important;
        font-family: var(--font-header) !important;
        font-weight: 900 !important;
        letter-spacing: 1px !important;
        text-shadow: 0 0 5px rgba(138, 3, 3, 0.15) !important;
    }

    /* 4. 主角装备重构：塔罗牌阵列风格 */
    .equip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
    .equip-card { background: linear-gradient(145deg, #fdfbf7 0%, #f4efe4 100%); border: 1px solid var(--gold-dark); border-radius: 4px; padding: 20px 10px; text-align: center; box-shadow: inset 0 0 15px rgba(138, 110, 37, 0.1), 0 4px 8px rgba(0,0,0,0.05); position: relative; transition: all 0.3s; }
    .equip-card:hover { transform: translateY(-3px); border-color: var(--accent-red); box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 8px 15px rgba(138, 3, 3, 0.1); }
    .equip-icon-ring { width: 46px; height: 46px; margin: 0 auto 12px auto; border-radius: 50%; background: radial-gradient(circle at center, #2b221e 0%, #110d0a 100%); border: 2px solid var(--gold-light); display: flex; justify-content: center; align-items: center; color: var(--gold-light); font-size: 1.2em; box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.8); }
    .equip-type { font-family: var(--font-header); font-size: 0.75em; color: var(--ink-secondary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px dashed rgba(138, 110, 37, 0.4); padding-bottom: 4px; }
    .equip-name { font-family: var(--font-body); font-size: 1.05em; font-weight: bold; color: var(--ink-primary); line-height: 1.3;}
    .equip-empty { opacity: 0.4; font-style: italic; font-size: 0.9em; }

    /* 5. 主角隐私重构：血色火漆绝密档案 */
    .privacy-dossier { background: #fffcf5; background-image: var(--paper-texture); border: 1px solid rgba(138, 110, 37, 0.4); padding: 35px 25px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.06), inset 0 0 50px rgba(138, 110, 37, 0.05); margin-top: 25px; }

<script>
    (function() {
        if (window.ROYAL_GRIMOIRE_V19_FINAL) return;
        window.ROYAL_GRIMOIRE_V19_FINAL = true;
        console.log("--- [命运虚空 V19 完美修复版] 初始化 ---");

        // --- [ 1. 数据工具 ] ---
        const isObject = (item) => (item && typeof item === 'object' && !Array.isArray(item));
        const deepMerge = (target, source) => {
            let output = Object.assign({}, target);
            if (isObject(target) && isObject(source)) {
                Object.keys(source).forEach(key => {
                    if (key === '$meta' || key === '//reason') return;
                    if (isObject(source[key])) {
                        if (!(key in target)) Object.assign(output, { [key]: source[key] });
                        else output[key] = deepMerge(target[key], source[key]);
                    } else { Object.assign(output, { [key]: source[key] }); }
                });
            }
            return output;
        };
        
        const SafeGet = (obj, path, def) => {
            try {
                let curr = obj;
                for (let key of path.split('.')) {
                    if (!curr || typeof curr !== 'object') return def;
                    let match = key.match(/^(.+?)\[(\d+)\]$/);
                    if (match) {
                        if (Array.isArray(curr[match[1]])) curr = curr[match[1]][parseInt(match[2])];
                        else return def;
                    } else { curr = curr[key]; }
                }
                return curr === undefined ? def : curr;
            } catch (e) { return def; }
        };
        const cleanKeys = (obj) => {
            if (!obj || typeof obj !== 'object') return [];
            return Object.keys(obj).filter(k => k !== '$meta' && k !== '//reason');
        };

// --- [ 2. 状态管理 ] ---
        let currentData = {};
        let activeTab = 'hero';
        let heroSubTab = 'core'; 
        let battleTarget = null;
        let battleTab = 'skills';
        window.invFilter = '全部';

        // --- [ 新增：全页面分页状态管理 ] ---
        const ITEMS_PER_PAGE = 8; 
        // 记录各个模块的当前页码
        let pageState = {
            bag: 1,
            contacts: 1, // 人脉
            destiny: 1,  // 红线
            skills: 1,   // 主角技能
            codex: 1     // 图鉴
        };


        // --- [ 辅助：生成分页条HTML ] ---
// --- [ 辅助：生成分页条HTML ] ---
        function renderPaginationHtml(moduleName, totalPages) {
            // 只有1页时不显示分页条
            if (totalPages <= 1) return '';
            
            // ★★★ 确保这里引用的是 pageState ★★★
            const cur = pageState[moduleName] || 1;
            
            // 修正页码越界
            if(cur > totalPages) pageState[moduleName] = totalPages;
            
            return `
            <div class="pagination-ctrl">
                <button class="page-btn" ${cur <= 1 ? 'disabled' : ''} onclick="window.UI.changePage('${moduleName}', -1)">
                    <i class="fa-solid fa-angle-left"></i> 上一卷
                </button>
                <span style="font-size:0.9em; font-weight:bold; color:var(--ink-primary);">第 ${cur} / ${totalPages} 卷</span>
                <button class="page-btn" ${cur >= totalPages ? 'disabled' : ''} onclick="window.UI.changePage('${moduleName}', 1)">
                    下一卷 <i class="fa-solid fa-angle-right"></i>
                </button>
            </div>`;
        }
     // --- [ 3. 交互控制中心 (修复版) ] ---
        window.UI = {
            // 切换大标签页 (如: 主角、地图、人脉)
            switch: (tab, el) => {
                activeTab = tab;
                // ★★★ 修复点：将 pages 改为 pageState ★★★
                // 切换大标签时重置对应页码到第一页
                if (pageState[tab]) pageState[tab] = 1;
                
                document.querySelectorAll('.rune-nav .rune-btn').forEach(b => b.classList.remove('active'));
                if(el) el.classList.add('active');
                renderStage();
            },

         // --- [ 终极完整版：唤出古籍弹窗 (包含隐私与记忆) ] ---
            showNpcModal: (npcKey, isRedLine) => {
                // 1. 获取对应数据
                let c = null;
                if (isRedLine) c = SafeGet(currentData, `命运系统.红线对象[0].${npcKey}`, {});
                else c = SafeGet(currentData, `人脉关系[0].${npcKey}`, {});
                
                if (!c || Object.keys(c).length === 0) return;

                // ==========================================
                // [ 基础数据提取 ]
                // ==========================================
                const name = SafeGet(c, '姓名[0]', npcKey);
                const race = SafeGet(c, '种族[0]', '未知');
                const job = SafeGet(c, '职业[0]', '流浪者');
                const age = SafeGet(c, '年龄[0]', '??');
                const level = SafeGet(c, '等级[0]', '1');
                const identity = SafeGet(c, '身份[0]', '平民');
                
                const favorRaw = String(SafeGet(c, '好感度[0]', '0/1000'));
                let parts = favorRaw.split('/');
                let curFavor = parseInt(parts[0]) || 0;
                let maxFavor = parseInt(parts[1]) || 1000;
                let absMax = Math.abs(maxFavor) === 0 ? 1000 : Math.abs(maxFavor);
                let widthPercent = Math.min(100, (Math.abs(curFavor) / absMax) * 100);
                const displayMax = curFavor < 0 ? `-${absMax}` : absMax;
                const favorText = `[${curFavor}/${displayMax}]`;

                const gridProps = [
                    { l: '身份', v: identity }, { l: '战力', v: SafeGet(c, '战力层级[0]') },
                    { l: '性格', v: SafeGet(c, '性格[0]') }, { l: '衣着', v: SafeGet(c, '衣着[0]') },
                    { l: '装备', v: SafeGet(c, '装备[0]') }, { l: '喜爱', v: SafeGet(c, '喜爱[0]') },
                    { l: '厌恶', v: SafeGet(c, '厌恶[0]') }, { l: '外貌', v: SafeGet(c, '外貌[0]') }
                ].filter(i => i.v && i.v !== '未知' && i.v !== '');
                
                const thoughts = SafeGet(c, '内心想法[0]', '');

                // ==========================================
                // [ 补回：隐私与性经验数据提取 ]
                // ==========================================
                const bodyPartConfig = [
                    { key: '奶子', icon: 'fa-regular fa-circle', label: '胸部' },
                    { key: '小穴', icon: 'fa-solid fa-spa', label: '私处' },
                    { key: '屁眼', icon: 'fa-regular fa-circle-dot', label: '后庭' },
                    { key: '阴茎', icon: 'fa-solid fa-arrow-up', label: '阳具' },
                    { key: '玉足', icon: 'fa-solid fa-shoe-prints', label: '足部' }
                ];
                const validBodyParts = bodyPartConfig.map(part => {
                    const val = SafeGet(c, part.key + '[0]');
                    return (val && val !== '未知') ? { ...part, val } : null;
                }).filter(Boolean);

                const sex = {
                    virgin: SafeGet(c, '是否处女[0]', SafeGet(c, '是否处男[0]')),
                    count: SafeGet(c, '交合次数[0]'),
                    exp: SafeGet(c, '性爱经验[0]'),
                    fetish: SafeGet(c, '性癖', [])
                };
                let fetishes = [];
                if(Array.isArray(sex.fetish)) {
                    fetishes = Array.isArray(sex.fetish[0]) ? sex.fetish[0] : sex.fetish;
                } else if (typeof sex.fetish === 'string') {
                    fetishes = [sex.fetish];
                }
                const hasPrivacy = validBodyParts.length > 0 || fetishes.length > 0 || sex.count || (sex.exp && sex.exp !== '未知');

                // ==========================================
                // [ 补回：记忆回廊数据提取 ]
                // ==========================================
                let memories = SafeGet(c, '记忆回廊', null);
                if (!memories) memories = SafeGet(c, '记忆', {});
                const memKeys = cleanKeys(memories);

                // ==========================================
                // [ 动态计算主题引擎 ]
                // ==========================================
                let themeClass = 'theme-neutral'; 
                let themeIcon = '❖';
                let themeTitle = '关系亲和度';

                if (isRedLine) {
                    themeClass = 'theme-destiny';
                    themeIcon = '❦';
                    themeTitle = '命运羁绊';
                } else if (curFavor < 0) {
                    themeClass = 'theme-hostile';
                    themeIcon = '⚔';
                } else if (curFavor >= 800) {
                    themeClass = 'theme-intimate';
                    themeIcon = '♥';
                } else if (curFavor >= 300) {
                    themeClass = 'theme-friendly';
                    themeIcon = '✦';
                }

                // ==========================================
                // [ 构建高精度DOM ]
                // ==========================================
                const modalHtml = `
    <div class="modal-close-btn" onclick="window.UI.closeNpcModal(event)">×</div>
    <div class="modal-ambient-fx"></div> 
    
    <div class="modal-content-wrapper">
        <div class="modal-header-block">
            <div class="card-name-box">
                ${name}
            </div>
            <div class="modal-meta-info">
                <span>Lv.${level}</span>
                <span>${race}</span>
                <span>${job}</span>
            </div>
        </div>

        <div class="card-body-area">
            <div style="margin-bottom: 35px; position: relative;">
                <div style="display:flex; justify-content:space-between; font-family:var(--font-header); font-size:0.7em; letter-spacing:2px; color:var(--t-outline); font-weight:bold;">
                    <span>${themeTitle}</span>
                    <span>${favorText}</span>
                </div>
                <div class="favor-progress-container">
                    <div class="favor-bar-fill" style="width: ${widthPercent}%;"></div>
                </div>
            </div>

            <div class="detail-grid">
                ${gridProps.map(p => `
                    <div class="detail-item">
                        <span class="detail-label">${p.l}</span> 
                        <span class="detail-val">${p.v}</span>
                    </div>
                `).join('')}
            </div>

            <div class="art-divider"><span class="art-dot">${themeIcon}</span></div>

            ${thoughts && thoughts !== '未知' ? `
                <div class="inner-thought">
                    ${thoughts}
                </div>
            ` : ''}

            ${hasPrivacy ? `
                <div style="margin-top:40px;">
                    <div class="privacy-label" style="text-align:center; letter-spacing:5px; margin-bottom:15px; opacity:0.6;">✧ 绝密卷宗 ✧</div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:20px;">
                        ${sex.virgin !== undefined ? `<span class="art-badge ${sex.virgin ? 'virgin' : 'not-virgin'}">${sex.virgin ? '纯洁' : '非处'}</span>` : ''}
                        ${fetishes.map(f => `<span class="tag-pill erotic-tag" style="background:none; border:none; border-bottom:1px double rgba(138,3,3,0.3); font-style:italic;">#${f}</span>`).join('')}
                    </div>
                    ${validBodyParts.map(b => `
                        <div style="margin-bottom:15px; text-align:center;">
                            <span style="font-family:var(--font-header); font-size:0.7em; color:var(--gold-dark); text-transform:uppercase;">[ ${b.label} ]</span>
                            <div style="font-family:var(--font-body); font-size:1em; color:var(--ink-primary); margin-top:4px;">${b.val}</div>
                        </div>
                    `).join('')}
                </div>
            ` : ''}

            <div class="modal-action-row">
                <button class="stamp-btn" onclick="window.UI.send('/send 拜访 ${name} |/trigger'); window.UI.closeNpcModal();">
                    前往见面
                </button>
            </div>
        </div>
    </div>
`;
                // ==========================================
                // [ 渲染管线阻断与重绘 (彻底防闪烁) ]
                // ==========================================
                const modalOverlay = document.getElementById('npc-modal-overlay');
                const modalContent = document.getElementById('npc-modal-content');
                
                modalContent.className = `npc-modal-card ${themeClass}`;
                modalContent.innerHTML = modalHtml;

                // 强制重排
                void modalContent.offsetWidth; 

                requestAnimationFrame(() => {
                    modalOverlay.classList.add('active');
                });
            },
       // --- [ 终极版：关闭古籍弹窗 ] ---
            closeNpcModal: (e) => {
                if(e) e.stopPropagation();
                const overlay = document.getElementById('npc-modal-overlay');
                const content = document.getElementById('npc-modal-content');
                
                // 步骤 A: 移除激活状态，触发CSS退场动画
                overlay.classList.remove('active');
                
                // 步骤 B: 等待动画物理结束再清空DOM。
                // 避免使用 setTimeout 猜测时间，直接监听动画结束事件最为精准。
                const handleTransitionEnd = (event) => {
                    // 确保是 overlay 自身的 opacity 过渡结束
                    if (event.propertyName === 'opacity') { 
                        content.innerHTML = ''; // 此时清空绝对安全，因为元素已经不可见
                        content.className = 'npc-modal-card'; // 重置类名
                        overlay.removeEventListener('transitionend', handleTransitionEnd);
                    }
                };
                overlay.addEventListener('transitionend', handleTransitionEnd);
            }, // <--- 注意这里的逗号

            // ==========================================
            // 下面是你上次复制时漏掉的方法，必须补回来
            // ==========================================
            
            // 切换主角子标签 (核心/装备/技能/隐私)
            switchHeroTab: (tab) => { 
                heroSubTab = tab; 
                pageState.skills = 1; 
                renderStage(); 
            },
            
            // 切换背包过滤器
            switchInvFilter: (filter) => { 
                window.invFilter = filter; 
                pageState.bag = 1; 
                renderStage(); 
            },

            // 通用翻页控制器
            changePage: (type, offset) => {
                if (!pageState[type]) pageState[type] = 1;
                pageState[type] += offset;
                if (pageState[type] < 1) pageState[type] = 1;
                renderStage();
                const stage = document.getElementById('stage');
                if (stage) stage.scrollTop = 0;
            },

            // 发送指令 (兼容多种环境)
            send: (cmd) => {
                if(typeof triggerSlash === 'function') triggerSlash(cmd);
                else if (typeof send === 'function') send(cmd);
                else console.log(`模拟指令发送: ${cmd}`);
            }

        }; // <--- ★★★ 关键修复：用这个闭合 window.UI 对象 ★★★

        // ==========================================
        // 下面继续接你原来的 renderAll 函数
        // ==========================================
        function renderAll() {
            const uiMode = SafeGet(currentData, 'UI状态.当前界面[0]', '日常');
            const isBattle = uiMode === '战斗';
            
            document.getElementById('nav-bar').classList.toggle('hidden', isBattle);
            document.getElementById('stage').classList.toggle('hidden', isBattle);
            document.getElementById('battle-ui').classList.toggle('hidden', !isBattle);

            renderHeader();
            if(isBattle) window.Battle.render();
            else renderStage();
        }

        function renderHeader() {
            const w = SafeGet(currentData, '世界', {});
            document.getElementById('val-time').innerText = SafeGet(w, '时间[0]', '??:??');
            document.getElementById('val-location').innerText = SafeGet(w, '地点[0]', '迷雾');
            document.getElementById('val-weather').innerText = SafeGet(w, '天气[0]', '无');
            document.getElementById('val-rep').innerText = SafeGet(w, '当前声望[0]', '0');
            const fpObj = document.getElementById('val-fp');
            if(fpObj) fpObj.innerText = SafeGet(currentData, '命运系统.命运点数[0]', '0');
        }
        function renderStage() {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';
            stage.classList.remove('fade-effect');
            void stage.offsetWidth; 
            stage.classList.add('fade-effect');

// [终极重塑版] 领域探索地图渲染
        function renderMap() {
            const rawLocs = SafeGet(currentData, '世界.邻近地点[0]', []);
            let locs = [];
            if (Array.isArray(rawLocs)) {
                locs = rawLocs.map(l => {
                    if (typeof l === 'string') return { name: l, desc: '未知的迷雾区域...' };
                    if (Array.isArray(l) && l.length > 0) return { name: l[0], desc: l[1] || '似乎没有什么特别之处。' };
                    return null;
                }).filter(l => l && l.name && l.name !== '未知地点');
            }

            // 动态标签解析器：根据名字赋予色彩与属性
            const getTags = (name) => {
                let terrainType = { label: '未知版图', color: '#594A42', bg: 'rgba(89, 74, 66, 0.08)', icon: 'fa-location-crosshairs' };
                let threatLevel = { label: '和平', color: '#2E5902', bg: 'rgba(46, 89, 2, 0.08)', icon: 'fa-shield-halved' };

                if (name.includes('森林') || name.includes('树') || name.includes('林') || name.includes('野')) {
                    terrainType = { label: '原始密林', color: '#2E5902', bg: 'rgba(46, 89, 2, 0.08)', icon: 'fa-tree' };
                    threatLevel = { label: '魔物潜伏', color: '#8A6E25', bg: 'rgba(138, 110, 37, 0.08)', icon: 'fa-eye' };
                } else if (name.includes('城') || name.includes('镇') || name.includes('村') || name.includes('都')) {
                    terrainType = { label: '人类聚落', color: '#1C305C', bg: 'rgba(28, 48, 92, 0.08)', icon: 'fa-city' };
                } else if (name.includes('海') || name.includes('河') || name.includes('水') || name.includes('湖')) {
                    terrainType = { label: '广袤水域', color: '#0b5b75', bg: 'rgba(11, 91, 117, 0.08)', icon: 'fa-water' };
                } else if (name.includes('山') || name.includes('崖') || name.includes('谷')) {
                    terrainType = { label: '险峻高地', color: '#594A42', bg: 'rgba(89, 74, 66, 0.08)', icon: 'fa-mountain' };
                    threatLevel = { label: '地势凶险', color: '#c45270', bg: 'rgba(196, 82, 112, 0.08)', icon: 'fa-triangle-exclamation' };
                } else if (name.includes('塔') || name.includes('遗迹') || name.includes('深渊') || name.includes('墓') || name.includes('洞')) {
                    terrainType = { label: '远古秘境', color: '#4A235A', bg: 'rgba(74, 35, 90, 0.08)', icon: 'fa-dungeon' };
                    threatLevel = { label: '极度致命', color: '#8a0303', bg: 'rgba(138, 3, 3, 0.08)', icon: 'fa-skull' };
                }

                return { terrainType, threatLevel };
            };

            const listHtml = locs.map(l => {
                const tags = getTags(l.name);
                return `
                <div class="map-location-card fade-effect">
                    <div class="map-card-header">
                        <div class="map-loc-title">

                        </button>
                    </div>
                    
                    <div class="map-tags-row">
                        <span class="map-env-tag" style="color:${tags.terrainType.color}; background:${tags.terrainType.bg}; border-color:${tags.terrainType.color}40;">
                            <i class="fa-solid ${tags.terrainType.icon}"></i> ${tags.terrainType.label}
                        </span>
                        <span class="map-env-tag" style="color:${tags.threatLevel.color}; background:${tags.threatLevel.bg}; border-color:${tags.threatLevel.color}40;">
                            <i class="fa-solid ${tags.threatLevel.icon}"></i> ${tags.threatLevel.label}

                    <div class="map-loc-desc">
                        ${l.desc}

                </div>
            `}).join('');

            return `
            <h2 class="art-title">领域探索</h2>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding:0 5px; border-bottom: 2px groove rgba(138, 110, 37, 0.3); padding-bottom: 12px;">

// [皇家重塑版] 生成史诗级人员卷宗卡片
        function renderCharacterCard(c, k, isRedLine) {
            const name = SafeGet(c, '姓名[0]', k);
            const level = SafeGet(c, '等级[0]', '1');
            const age = SafeGet(c, '年龄[0]', '??'); 
            const race = SafeGet(c, '种族[0]', '未知');
            const job = SafeGet(c, '职业[0]', '流浪者');
            const desc = SafeGet(c, '评价[0]', '萍水相逢'); 
            const favorRaw = String(SafeGet(c, '好感度[0]', '0/1000'));
            let curFavor = parseInt(favorRaw.split('/')[0]) || 0;
            
            // 1. 动态生成阶级称谓
            let favorWord = '平淡';
            if (isRedLine) {
                favorWord = '宿命';
            } else {
                if (curFavor < 0) favorWord = '敌对';
                else if (curFavor < 300) favorWord = '泛泛';
                else if (curFavor < 800) favorWord = '融洽';
                else favorWord = '倾心';
            }

            // 2. 拼接史诗头衔 (过滤掉无用信息)
            const epithetParts = [];
            if (age && age !== '??' && age !== '未知') epithetParts.push(`${age}岁`);
            if (race && race !== '未知') epithetParts.push(race);
            if (job && job !== '未知' && job !== '流浪者') epithetParts.push(job);
            epithetParts.push(`Lv.${level}`);
            
            const epithetString = epithetParts.length > 0 ? `✧ ${epithetParts.join(' · ')} ✧` : `✧ 迷雾中的旅人 ✧`;

            const themeClass = isRedLine ? 'red-line-theme' : '';
            const icon = isRedLine ? 'fa-heart' : 'fa-chess-knight';

            return `
            <div class="royal-roster-card ${themeClass} fade-effect" onclick="window.UI.showNpcModal('${k}', ${isRedLine})">
                <div class="royal-seal"><i class="fa-solid ${icon}"></i></div>

                    <div class="royal-name">${name}</div>
                    <div class="royal-epithet">${epithetString}</div>
                    <div class="royal-annotation">${desc}</div>
                </div>
                <div class="royal-favor-box">
                    <div class="royal-favor-word">${favorWord}</div>
                    <div class="royal-favor-num">${curFavor}</div>
                </div>
            </div>`;
        }
