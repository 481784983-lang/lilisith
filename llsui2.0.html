<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>命运虚空 (V19 完美重制版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    /* --- [ 1. 艺术核心变量 ] --- */
    :root {
        --paper-bg: #E3D8C4;
        --paper-texture: url("https://www.transparenttextures.com/patterns/aged-paper.png");
        --ink-primary: #2B221E;
        --ink-secondary: #594A42;
        
        --gold-light: #D4AF37;
        --gold-dark: #8A6E25;
        --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        
        --accent-red: #8a0303; 
        --accent-blue: #1C305C; 
        --accent-purple: #4A235A; 
        --accent-green: #2E5902;

        --font-header: 'Cinzel Decorative', serif;
        --font-body: 'Cormorant Garamond', 'Noto Serif SC', serif;
    }

    /* --- [ 全局重置 ] --- */
    body {
        margin: 0; padding: 10px;
        background: transparent;
        font-family: var(--font-body);
        color: var(--ink-primary);
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; border: 1px solid var(--paper-bg); }

    /* --- [ 主容器 ] --- */
    #grimoire-container {
        max-width: 900px; margin: 0 auto;
        background-color: var(--paper-bg);
        background-image: var(--paper-texture);
        border: 4px double var(--gold-dark);
        outline: 2px solid var(--ink-primary);
        outline-offset: -8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(43, 34, 30, 0.1);
        position: relative;
        min-height: 750px;
        display: flex; flex-direction: column;
        padding: 5px;
    }

    /* 装饰纹样 */
    .corner-art { position: absolute; width: 40px; height: 40px; border: 2px solid var(--gold-dark); z-index: 0; pointer-events: none; }
    .corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }
    .corner-art::after { content: '❖'; position: absolute; font-size: 20px; color: var(--gold-dark); }
    .corner-tl::after { top: -8px; left: -5px; } .corner-tr::after { top: -8px; right: -5px; }
    .corner-bl::after { bottom: -8px; left: -5px; } .corner-br::after { bottom: -8px; right: -5px; }

    /* --- [ Header ] --- */
    .astral-header {
        display: flex; justify-content: center; align-items: center; gap: 20px;
        padding: 15px 40px; border-bottom: 1px solid var(--ink-secondary);
        margin-bottom: 10px; position: relative; z-index: 2; flex-wrap: wrap;
    }
    .astral-header::after { content: ''; position: absolute; bottom: 2px; left: 15%; right: 15%; height: 1px; background: var(--gold-dark); }
    .header-data { font-family: var(--font-header); font-weight: 700; color: var(--ink-secondary); display: flex; align-items: center; gap: 6px; font-size: 0.95em; }
    .header-divider { color: var(--gold-dark); font-size: 0.8em; }

    /* --- [ Nav ] --- */
    .rune-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; padding: 10px 0 20px 0; position: relative; z-index: 10; }
    .rune-btn {
        width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; border: 2px solid var(--gold-dark);
        color: var(--gold-dark); display: flex; align-items: center; justify-content: center; font-size: 1.1em;
        cursor: pointer; transition: all 0.4s; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .rune-btn:hover { transform: translateY(-3px) scale(1.1); color: #fff; background: var(--accent-red); border-color: #fff; }
    .rune-btn.active { background: var(--gold-gradient); color: var(--ink-primary); border-color: var(--ink-primary); transform: scale(1.15); box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
    .rune-tooltip {
        position: absolute; bottom: -25px; font-family: var(--font-header); font-size: 0.7em; 
        color: var(--ink-primary); font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap;
    }
    .rune-btn:hover .rune-tooltip, .rune-btn.active .rune-tooltip { opacity: 1; bottom: -28px; }

    /* --- [ Stage ] --- */
    .stage-container { flex-grow: 1; padding: 20px 30px; overflow-y: auto; position: relative; z-index: 5; }
    .fade-effect { animation: pageReveal 0.5s ease-out forwards; }
    @keyframes pageReveal { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }

    /* --- [ Components ] --- */
    h2.art-title { text-align: center; font-family: var(--font-header); font-size: 2em; color: var(--ink-primary); margin: 0 0 25px 0; text-transform: uppercase; letter-spacing: 2px; }
    h2.art-title::after { content: '— ❧ —'; display: block; font-size: 0.4em; color: var(--gold-dark); font-family: var(--font-body); margin-top: 5px; }

    /* 水晶进度条 */
    .crystal-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .crystal-casing { flex-grow: 1; height: 12px; background: #222; border: 1px solid #444; border-radius: 6px; position: relative; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); }
    .crystal-casing::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent); pointer-events: none; }
    .crystal-fluid { height: 100%; transition: width 0.6s ease; box-shadow: 0 0 8px currentColor; position: relative; }
    .crystal-fluid::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); background-size: 200% 100%; animation: fluidFlow 2s infinite linear; }
    @keyframes fluidFlow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* --- [ V19.6 修复版：支持折叠与线条艺术/* --- [ V19.9 皇家艺术重制版：人脉与红线 ] --- */

    /* 1. 核心卡片容器：羊皮纸风格 */
    details.art-card {
        background: linear-gradient(to bottom, #fdfbf7, #f4efe4); /* 仿旧纸张渐变 */
        border: 1px solid rgba(138, 110, 37, 0.3); /* 暗金边框 */
        border-radius: 4px;
        margin-bottom: 16px;
        position: relative;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 2px 5px rgba(43, 34, 30, 0.05), 
                    inset 0 0 20px rgba(138, 110, 37, 0.02); /* 内发光营造质感 */
        overflow: hidden;
    }
    
    /* 悬停效果：浮起并增强金边 */
    details.art-card:hover {
        transform: translateY(-2px);
        border-color: rgba(138, 110, 37, 0.6);
        box-shadow: 0 8px 20px rgba(43, 34, 30, 0.15);
    }
    
    /* 展开状态：加深背景，增加沉浸感 */
    details.art-card[open] {
        background: #fffefb;
        border-color: var(--gold-dark);
        box-shadow: 0 5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(138, 110, 37, 0.1);
    }

    /* --- [ 红线对象专属设计：朱砂与恋慕 ] --- */
    details.art-card.destiny-mode {
        border-color: rgba(138, 3, 3, 0.2);
        background: linear-gradient(135deg, #fffbfb 0%, #fff0f0 100%);
    }
    details.art-card.destiny-mode:hover, details.art-card.destiny-mode[open] {
        border-color: var(--accent-red);
        box-shadow: 0 5px 20px rgba(138, 3, 3, 0.15);
    }
    /* 红线卡片背景纹理（爱心水印） */
    details.art-card.destiny-mode::before {
        content: "❤";
        position: absolute; right: -10px; top: -10px;
        font-size: 100px; color: var(--accent-red);
        opacity: 0.03; font-family: sans-serif;
        pointer-events: none; z-index: 0;
    }

    /* 2. 头部区域：古典标题栏 */
    summary.card-header-area {
        padding: 12px 18px;
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; list-style: none; user-select: none;
        background: rgba(0,0,0,0.02);
        border-bottom: 1px solid rgba(138, 110, 37, 0.1);
        transition: background 0.3s;
        position: relative; z-index: 1;
    }
    summary.card-header-area::-webkit-details-marker { display: none; }
    summary.card-header-area:hover { background: rgba(138, 110, 37, 0.05); }

    /* 头部名字设计 */
    .card-name-box { 
        font-family: 'Cinzel Decorative', serif; /* 华丽字体 */
        font-size: 1.3em; 
        color: var(--ink-primary); 
        font-weight: 700; 
        display: flex; align-items: baseline; 
        text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }
    .destiny-mode .card-name-box { 
        color: var(--accent-red); 
        text-shadow: 0 0 5px rgba(138, 3, 3, 0.1);
    }
    
    /* 头部图标装饰 */
    .card-name-box i {
        margin-right: 8px; 
        color: var(--gold-dark);
        font-size: 0.9em;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }
    .destiny-mode .card-name-box i { color: var(--accent-red); }

    /* 折叠指示器：金色箭头 */
    .fold-indicator {
        color: var(--gold-dark); opacity: 0.6;
        transition: transform 0.4s ease;
        font-size: 0.9em;
    }
    details[open] .fold-indicator { transform: rotate(180deg); opacity: 1; color: var(--accent-red); }

    /* 3. 内容区域 */
    .card-body-area { 
        padding: 15px 20px; 
        animation: slideDown 0.4s ease; 
        position: relative; z-index: 1;
        font-family: 'Cormorant Garamond', serif; /* 正文古典字体 */
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

/* --- [ 增强版：过渡与动画 ] --- */
    .fade-effect { animation: fadeInScale 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes fadeInScale { 
        from { opacity: 0; transform: translateY(10px) scale(0.98); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    /* 详情页展开动画 */
    details.art-card[open] .card-body-area {
        animation: expandOpen 0.5s ease-out;
    }
    @keyframes expandOpen {
        from { opacity: 0; transform: translateY(-10px); max-height: 0; }
        to { opacity: 1; transform: translateY(0); max-height: 1000px; }
    }

/* =========================================
       [ 1. 增强样式：大号好感度条与数值显示 ]
       ========================================= */
    .favor-progress-container {
        height: 20px; /* 加高 */
        background: #1a1a1a;
        border-radius: 10px;
        margin: 8px 0 15px 0;
        position: relative;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.2);
        border: 1px solid rgba(138, 110, 37, 0.4);
        overflow: hidden;
    }

    .favor-bar-fill {
        height: 100%;
        /* 默认正向好感：金色流光 */
        background: linear-gradient(180deg, #FEE140 0%, #D4AF37 50%, #8A6E25 100%);
        border-radius: 8px;
        transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        position: relative;
        z-index: 1;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }
    
    /* 进度条流光动画 */
    .favor-bar-fill::after {
        content: ""; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shine 2s infinite linear;
    }
    @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* 数值文本层 (新增) */
    .favor-text-overlay {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', monospace; font-weight: bold; font-size: 0.85em;
        color: #fff; text-shadow: 0 1px 3px #000, 0 0 5px #000;
        z-index: 2; letter-spacing: 1px; pointer-events: none;
    }

    /* 红线模式：红色 */
    .destiny-mode .favor-bar-fill {
        background: linear-gradient(180deg, #ff9a9e 0%, #ff5252 50%, #8a0303 100%);
        box-shadow: 0 0 10px rgba(229, 45, 39, 0.5);
    }

    /* 负好感模式：黑紫色 */
    .negative-mode .favor-bar-fill {
        background: linear-gradient(180deg, #9b59b6 0%, #4a235a 50%, #211226 100%);
        box-shadow: 0 0 10px rgba(74, 35, 90, 0.6);
    }
    .negative-mode .favor-progress-container {
        border-color: #4a235a;
    }

    /* =========================================
       [ 2. 增强样式：翻页与折叠动画 ]
       ========================================= */
    
    /* 页面载入/翻页时的淡入缩放 */
    .fade-effect { 
        animation: fadeInScale 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
    }
    @keyframes fadeInScale { 
        from { opacity: 0; transform: translateY(10px) scale(0.98); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    /* 折叠详情展开动画 */
    details.art-card[open] .card-body-area {
        animation: expandOpen 0.5s ease-out;
        transform-origin: top;
    }
    @keyframes expandOpen {
        from { opacity: 0; transform: translateY(-10px); max-height: 0; }
        to { opacity: 1; transform: translateY(0); max-height: 2000px; }
    }

    /* 分页按钮增强 */
    .pagination-ctrl {
        display: flex; justify-content: center; align-items: center;
        gap: 15px; margin-top: 20px; padding: 10px;
        border-top: 1px double var(--gold-dark);
        font-family: var(--font-header);
        animation: fadeIn 0.5s ease;
    }    /* 4. 属性网格：去掉边框，改用点阵引导线 */
    .detail-grid { 
        display: grid; grid-template-columns: repeat(2, 1fr); 
        gap: 8px 20px; 
    }
    .detail-item { 
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1px dotted rgba(138, 110, 37, 0.3); /* 金色虚线 */
        padding-bottom: 3px;
    }
    .detail-label { 
        font-family: 'Cinzel Decorative', serif; 
        color: var(--ink-secondary); 
        font-weight: bold; font-size: 0.8em; 
    }
    .detail-val { 
        font-weight: 600; color: var(--ink-primary); font-size: 1.05em; 
    }

    /* 5. 内心想法：手写体风格 */
    .inner-thought {
        margin-top: 15px; padding: 10px 15px; 
        background: rgba(74, 35, 90, 0.04);
        border-left: 3px solid var(--accent-purple);
        font-family: 'Cormorant Garamond', serif; 
        font-style: italic; font-size: 1.1em; line-height: 1.4;
        color: var(--accent-purple);
        position: relative; border-radius: 0 4px 4px 0;
    }
    .inner-thought::before { content: "❝"; position: absolute; top: -5px; left: 2px; font-size: 1.5em; opacity: 0.2; }

    /* 6. 华丽分割线 */
    .fancy-line {
        display: flex; align-items: center; justify-content: center;
        margin: 15px 0; color: var(--gold-dark); opacity: 0.6;
    }
    .fancy-line::before, .fancy-line::after {
        content: ""; flex: 1; height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
    }
    .fancy-line span { 
        padding: 0 10px; font-size: 1.2em; font-family: 'Cinzel Decorative', serif;
    }

    /* 7. 隐私与记忆的装饰块 */
    .art-badge {
        display: inline-flex; align-items: center; padding: 2px 8px; 
        border: 1px solid rgba(138, 110, 37, 0.4); 
        background: #fff; border-radius: 2px;
        font-family: 'Cinzel Decorative', serif; font-size: 0.75em; color: var(--ink-secondary);
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .erotic-tag { color: #8a0303; border-color: rgba(138, 3, 3, 0.3); background: rgba(138,3,3,0.02); }
    
    .art-text-block {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0,0,0,0.05); border-left: 2px solid var(--gold-dark);
        padding: 8px 12px; margin: 5px 0 10px 0;
        font-size: 0.95em; line-height: 1.6; color: #444;
        font-family: 'Noto Serif SC', serif;
    }
    .privacy-label {
        font-family: 'Cinzel Decorative', serif; color: var(--gold-dark); 
        font-weight: bold; font-size: 0.85em; margin-top: 10px; display: block;
    }

    /* 记忆回廊条目 */
    .memory-entry-art {
        background: linear-gradient(to right, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
        border-bottom: 1px solid rgba(138, 110, 37, 0.2);
        padding: 8px 10px; margin-bottom: 4px;
        transition: 0.3s; cursor: default;
    }
    .memory-entry-art:hover { background: #fff; padding-left: 15px; border-left: 2px solid var(--gold-dark); }
    .mem-title { font-weight: bold; color: var(--ink-primary); font-family: 'Cinzel Decorative', serif; font-size: 0.9em; }
    .mem-desc { font-size: 0.9em; color: #666; font-style: italic; margin-top: 2px; }

    /* 按钮微调 */
    .magic-btn {
        font-family: 'Cinzel Decorative', serif; letter-spacing: 1px;
        border: 1px solid var(--gold-dark); color: var(--gold-dark);
        background: transparent; padding: 4px 12px;
        transition: all 0.3s;
    }
    .magic-btn:hover {
        background: var(--gold-dark); color: #fff; 
        box-shadow: 0 0 10px rgba(138, 110, 37, 0.4);
    }
    .destiny-mode .magic-btn { border-color: var(--accent-red); color: var(--accent-red); }
    .destiny-mode .magic-btn:hover { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px rgba(138, 3, 3, 0.4); }

    /* 隐私与记忆的折叠Summary美化 */
    details > summary { outline: none; }
    details > summary i { width: 20px; text-align: center; }
    /* 标签页系统 (主角页) */
    .tab-header { display: flex; border-bottom: 1px solid var(--ink-secondary); margin-bottom: 15px; }
    .tab-btn { 
        padding: 8px 15px; background: transparent; border: none; font-family: var(--font-header); 
        color: var(--ink-secondary); cursor: pointer; transition: 0.3s; font-size: 1em; opacity: 0.7;
    }
    .tab-btn:hover { opacity: 1; color: var(--gold-dark); }
    .tab-btn.active { color: var(--ink-primary); font-weight: bold; border-bottom: 2px solid var(--gold-dark); opacity: 1; }

    /* 详情网格 (人脉/主角) */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .detail-item { font-size: 0.9em; display: flex; align-items: center; gap: 6px; border-bottom: 1px dotted rgba(0,0,0,0.1); padding-bottom: 2px; }
    .detail-label { color: var(--ink-secondary); font-weight: bold; font-size: 0.85em; opacity: 0.8; }
    .detail-val { font-weight: 500; color: var(--ink-primary); }

    /* 特殊文本块 */
    .inner-thought { 
        margin-top: 10px; padding: 10px; background: rgba(74, 35, 90, 0.05); 
        border-left: 3px solid var(--accent-purple); color: var(--accent-purple); 
        font-style: italic; font-size: 0.95em; position: relative;
    }
    .inner-thought::before { content: '❝'; font-family: var(--font-header); font-size: 2em; position: absolute; left: 2px; top: -10px; opacity: 0.3; }

    /* 记忆回廊 */
    .memory-entry { border: 1px solid rgba(138, 110, 37, 0.2); background: rgba(255,255,255,0.3); margin-top: 5px; }
    .memory-entry summary { padding: 8px; cursor: pointer; font-weight: bold; font-size: 0.9em; list-style: none; display: flex; align-items: center; gap: 5px; }
    .memory-entry summary::after { content: '+'; margin-left: auto; font-weight: normal; }
    .memory-entry[open] summary::after { content: '-'; }
    .memory-content { padding: 8px 12px; font-size: 0.9em; color: var(--ink-secondary); border-top: 1px dashed rgba(0,0,0,0.1); }

    .tag-pill { background: #eee; padding: 1px 5px; border-radius: 3px; font-size: 0.75em; border: 1px solid #ccc; margin-right: 4px; display: inline-block; }
    .erotic-tag { color: var(--accent-red); border-color: var(--accent-red); background: rgba(138, 3, 3, 0.05); }

    .magic-btn { 
        background: transparent; border: 1px solid var(--gold-dark); font-family: var(--font-header);
        color: var(--ink-primary); padding: 4px 10px; cursor: pointer; font-size: 0.8em; transition: 0.3s;
    }
    .magic-btn:hover { background: var(--gold-dark); color: #fff; }

    /* --- [ 战斗界面 (Battle UI - Dark Ritual Style) ] --- */
    #battle-ui {
        background: #111; color: #ddd; padding: 15px; border: 3px double var(--accent-red);
        min-height: 600px; display: flex; flex-direction: column; gap: 15px;
        box-shadow: inset 0 0 50px rgba(138, 3, 3, 0.2);

        const isObject = (item) => (item && typeof item === 'object' && !Array.isArray(item));
        const deepMerge = (target, source) => {
            let output = Object.assign({}, target);
            if (isObject(target) && isObject(source)) {
                Object.keys(source).forEach(key => {
                    if (key === '$meta' || key === '//reason') return;
                    if (isObject(source[key])) {
                        if (!(key in target)) Object.assign(output, { [key]: source[key] });
                        else output[key] = deepMerge(target[key], source[key]);
                    } else { Object.assign(output, { [key]: source[key] }); }
                });
            }
            return output;
        };
        
        const SafeGet = (obj, path, def) => {
            try {
                let curr = obj;
                for (let key of path.split('.')) {
                    if (!curr || typeof curr !== 'object') return def;
                    let match = key.match(/^(.+?)\[(\d+)\]$/);
                    if (match) {
                        if (Array.isArray(curr[match[1]])) curr = curr[match[1]][parseInt(match[2])];
                        else return def;
                    } else { curr = curr[key]; }
                }
                return curr === undefined ? def : curr;
            } catch (e) { return def; }
        };
        const cleanKeys = (obj) => {

            return Object.keys(obj).filter(k => k !== '$meta' && k !== '//reason');

// --- [ 2. 状态管理 ] ---

                const input = document.getElementById('battle-input');
                if(!input.value.trim()) return;
                window.UI.send(`/send ${input.value.replace(/\n/g, ' ')} |/trigger`);
                input.value = '';
            }
        };

// --- [ 6. 启动 (增强版) ] ---
        async function Init() {
            console.log("正在初始化界面...");
            // 尝试获取数据
            const hasChat = typeof getChatMessages === 'function';
            let data = {};
            try {
                // 获取当前上下文数据
                const msgs = hasChat ? await getChatMessages(getCurrentMessageId()) : [];
                data = msgs?.[0]?.data?.stat_data || {};
            } catch(e) { console.log('Data fetch skipped', e); }
            
            // 合并默认数据，防止数据缺失导致报错
            currentData = deepMerge({
                'UI状态': {'当前界面': ['日常']}, 
                '世界': {'时间':['--:--']}, 
                '主角': {'资源':{'生命值':[100]}}
            }, data);
            
            renderAll();
        }
        
        // 兼容不同的加载环境 (网页版 / 移动端 / 本地测试)
        if (typeof waitGlobalInitialized === 'function') {
            waitGlobalInitialized('Mvu').then(() => {
                Init();
                // 监听数据更新事件
                if(typeof eventOn === 'function' && typeof Mvu !== 'undefined') {
                    eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, m => { 
                        if (m?.stat_data) { 
                            currentData = m.stat_data; 
                            renderAll(); 
                        } 
                    });
                }
            });
        } else { 
            // 如果是普通网页环境，直接启动
            // 使用 setTimeout 确保 DOM 元素已经由浏览器渲染完毕
            setTimeout(Init, 100);
        }
    })();
</script>
</body>
</html>
